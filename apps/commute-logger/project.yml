# Generate CommuteLogger.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: CommuteLogger
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  CommuteLogger:
    type: application
    platform: iOS
    sources:
      - CommuteLogger
    info:
      path: CommuteLogger/Info.plist
      properties:
        CFBundleDisplayName: Commute Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Commute Log uses your location to set your home and work and to measure trips between them.
        NSLocationAlwaysAndWhenInUseUsageDescription: Choose "Always" so Commute Log can notice when you leave home or work and log your commute automatically, even when the app is closed.
        NSMotionUsageDescription: Commute Log uses motion data to tell whether a trip was by car, transit, bike or on foot.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.commutelogger
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  CommuteLoggerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CommuteLoggerTests
    dependencies:
      - target: CommuteLogger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.commutelogger.tests
schemes:
  CommuteLogger:
    build:
      targets:
        CommuteLogger: all
        CommuteLoggerTests: [test]
    test:
      targets:
        - CommuteLoggerTests
