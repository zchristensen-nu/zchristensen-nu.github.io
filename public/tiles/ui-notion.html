document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]) {
    if (a.tagName === 'A') e.preventDefault();
    if (POP && POP.anchor === a) { closePop(true); return; }
    ACT[a.dataset.act](a, e); return;
  }
  const card = e.target.closest('.card[data-card]');
  if (card) { openPeek(card.dataset.card); return; }
  const tr = e.target.closest('tr[data-row]');
  if (tr && !e.target.closest('a, button')) { openPeek(tr.dataset.row); return; }
  const link = e.target.closest('a[href^="#/"]');
  if (link && (peekId || app.classList.contains('drawer-open')) && link.getAttribute('href') === location.hash) { closePeek(false); closeDrawer(false); }
}, true);

/* ================= Keyboard ================= */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && !e.shiftKey && k.toLowerCase() === 'k') { e.preventDefault(); if ($('.modal')) closeSearch(); else openSearch(); return; }
  if (mod && (k === '\\' || e.code === 'Backslash')) { e.preventDefault(); toggleSidebar(); return; }
  if (mod && e.shiftKey && k.toLowerCase() === 'l') { e.preventDefault(); toggleTheme(); return; }
  if ($('.modal')) return;
  if (k === 'Escape') {
    if (e.defaultPrevented || SLASH) return;
    if (POP) { e.preventDefault(); closePop(true); return; }
    if (bdrag || cdrag) return;
    if (peekId) { e.preventDefault(); closePeek(true); return; }
    if (app.classList.contains('drawer-open')) { closeDrawer(true); return; }
    return;
  }
  if (POP) {
    const items = $$('[role^="menuitem"], .fontcard, .seg button, .mi, .share button, .share input', POP.el).filter((x, i, arr) => arr.indexOf(x) === i && !x.disabled);
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault();
      const i = items.indexOf(document.activeElement);
      const n = items[(i + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
      if (n) n.focus();
      return;
    }
    if (k === 'Tab' && POP.role === 'menu') { e.preventDefault(); closePop(true); return; }
    if (k === 'Tab' && POP.role === 'dialog') {
      const f = $$('button:not([disabled]), input:not([disabled])', POP.el);
      if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
      return;
    }
    if ((k === 'Home' || k === 'End') && items.length) { e.preventDefault(); items[k === 'Home' ? 0 : items.length - 1].focus(); return; }
  }
  const t = e.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab' && (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'Home' || k === 'End')) {
    e.preventDefault();
    const tabs = $$('[role="tab"]', t.closest('[role="tablist"]'));
    const i = tabs.indexOf(t);
    const n = k === 'Home' ? tabs[0] : k === 'End' ? tabs[tabs.length - 1] : tabs[(i + (k === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    n.click();
    return;
  }
  if (t.classList && t.classList.contains('col-rs') && (k === 'ArrowLeft' || k === 'ArrowRight')) { e.preventDefault(); setColW(t, parseFloat(t.getAttribute('aria-valuenow')) + (k === 'ArrowRight' ? 16 : -16)); return; }
  if (t.classList && t.classList.contains('card') && t.dataset.card) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); openPeek(t.dataset.card); return; }
    if (e.altKey && (k === 'ArrowLeft' || k === 'ArrowRight')) {
      e.preventDefault();
      const id = t.dataset.card, P = PAGES[id], groups = DB[P.dbId].groups;
      const gi = groups.indexOf(P.row.status) + (k === 'ArrowRight' ? 1 : -1);
      if (gi < 0 || gi >= groups.length) return;
      setStatus(id, groups[gi]);
      const el = dbEl(P.dbId), c = el && $(`.card[data-card="${id}"]`, el);
      if (c) { c.focus(); c.classList.add('landed'); }
      return;
    }
  }
  if (t.classList && t.classList.contains('tgl-sum')) return;
});

/* ================= Misc wiring ================= */
scroller.addEventListener('scroll', () => { $('#topbar').classList.toggle('scrolled', scroller.scrollTop > 2); if (POP && !POP.el.contains(document.activeElement)) closePop(false); }, { passive: true });
$('#peek-body').addEventListener('scroll', e => $('#peek-bar').classList.toggle('scrolled', e.target.scrollTop > 2), { passive: true });
document.addEventListener('pointerdown', e => {
  if (POP && !POP.el.contains(e.target) && !(POP.anchor && POP.anchor.contains(e.target))) closePop(false);
  if (SLASH && !SLASH.el.contains(e.target) && e.target !== SLASH.ed) closeSlash();
  if (peekId && isNarrow() === false && !e.target.closest('#peek, .pop, .modal, .toast, [data-act="peek"], .card, tr[data-row], .tl-bar, .cal-ev, .gcard, .ti-actions, .corner, [data-act="db-new"], .bnew')) {
    if (e.target.closest('#main-scroller')) closePeek(false);
  }
});
window.addEventListener('resize', () => { closePop(false); closeSlash(); });
const mqNarrow = window.matchMedia('(max-width: 760px)');
const onNarrow = () => { app.classList.remove('drawer-open'); syncInert(); };
if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', onNarrow); else mqNarrow.addListener(onNarrow);
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
const onScheme = () => { if (mode === 'system') applyTheme(true); };
if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else mqDark.addListener(onScheme);
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', savePS);

/* ================= Init ================= */
if (!isMac) {
  $$('.kbd-mod').forEach(k => { k.textContent = k.textContent.replace('⌘⇧', 'Ctrl+Shift+').replace('⌘', 'Ctrl+'); });
  $$('[title]').forEach(el => { el.title = el.title.replace('⌘', 'Ctrl+'); });
}
if (store.get('ws-sb', false)) app.classList.add('sb-collapsed');
$('#peek').inert = true;
syncInert();
applyTheme(false);
route();
})();
