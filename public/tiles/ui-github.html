/* =========================================================

   ========================================================= */

button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
p{margin:0}

.muted{color:var(--fg-muted)}

.container{max-width:1280px;margin:0 auto;padding:0 32px}
.skip{position:fixed;top:8px;left:8px;z-index:100;padding:8px 12px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r);transform:translateY(-200%);transition:transform var(--dur-quick)}
.skip:focus{transform:none}

/* =========================================================
   Primitives: buttons, counters, labels, avatar
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;font:500 14px/1 var(--font-sans);color:var(--fg);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:var(--r);box-shadow:var(--shadow-sm);cursor:pointer;white-space:nowrap;text-decoration:none!important;transition:background-color var(--dur-quick),border-color var(--dur-quick),color var(--dur-quick),transform var(--dur-quick)}

.btn.is-focus{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{color:var(--fg-disabled);background:var(--btn-bg);border-color:var(--border-muted);cursor:not-allowed;transform:none;box-shadow:none}

.btn-primary:hover,.btn-primary.is-hover{background:var(--primary-hover);border-color:rgba(0,0,0,.2)}
.btn-primary:active,.btn-primary.is-active{background:var(--primary-active)}

.btn-danger{color:var(--danger-fg)}
.btn-danger .ic{color:inherit}
.btn-danger:hover,.btn-danger.is-hover{color:var(--fg-on-emphasis);background:var(--danger-emphasis);border-color:rgba(0,0,0,.14)}
.btn-danger:active,.btn-danger.is-active{color:var(--fg-on-emphasis);background:var(--danger-emphasis);filter:brightness(.92)}
.btn-danger:disabled{color:var(--fg-disabled);background:var(--btn-bg);filter:none}

.btn-invisible .ic{color:inherit}
.btn-invisible:hover,.btn-invisible.is-hover{background:var(--hover-bg);border-color:transparent}

.btn-sm{height:28px;padding:0 10px;font-size:12px}

.label{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;font:500 12px/1 var(--font-sans);color:var(--fg-muted);border:1px solid var(--border);border-radius:var(--r-pill);white-space:nowrap}

.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;font:500 12px/1 var(--font-sans);border-radius:var(--r-pill);border:1px solid transparent;white-space:nowrap}
.tag-bug{color:var(--danger-fg);background:var(--danger-subtle);border-color:color-mix(in srgb,var(--danger-fg) 25%,transparent)}
.tag-enhancement{color:var(--accent-fg);background:var(--accent-subtle);border-color:color-mix(in srgb,var(--accent-fg) 25%,transparent)}
.tag-accessibility{color:var(--done-fg);background:var(--done-subtle);border-color:color-mix(in srgb,var(--done-fg) 25%,transparent)}
.tag-docs{color:var(--attention-fg);background:var(--attention-subtle);border-color:color-mix(in srgb,var(--attention-fg) 25%,transparent)}

.topic{display:inline-flex;align-items:center;height:24px;padding:0 10px;font:500 12px/1 var(--font-sans);color:var(--accent-fg);background:var(--accent-subtle);border-radius:var(--r-pill);transition:background-color var(--dur-quick),color var(--dur-quick)}
.topic:hover{color:var(--fg-on-emphasis);background:var(--accent-emphasis);text-decoration:none}
.state{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;font:500 13px/1 var(--font-sans);color:var(--fg-on-emphasis);border-radius:var(--r-pill)}

.avatar{--s:32px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;font:600 calc(var(--s)*.36)/1 var(--font-sans);letter-spacing:-.01em;color:#fff;background:radial-gradient(120% 120% at 20% 10%,#3aa168 0%,#1e7a49 38%,#1d4f9e 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);user-select:none}

.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;color:var(--fg-muted);font-size:12px}

.box{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md)}

/* =========================================================
   Header
   ========================================================= */
.site-header{position:relative;background:var(--canvas-subtle);border-bottom:1px solid var(--border-muted)}
.hdr{display:flex;align-items:center;gap:16px;height:var(--hdr-h)}
.brand{display:flex;align-items:center;gap:12px;color:var(--fg);font-size:14px;border-radius:var(--r)}
.brand:hover{text-decoration:none}
.mark{width:28px;height:28px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;font-weight:600}
.crumb-sep{color:var(--fg-subtle);font-weight:400}

.hdr-spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:8px;width:300px;height:32px;padding:0 6px 0 10px;color:var(--fg-subtle);background:var(--canvas);border:1px solid var(--border);border-radius:var(--r);cursor:text;transition:border-color var(--dur-quick),box-shadow var(--dur-quick)}

.hdr-actions{display:flex;align-items:center;gap:4px}
.hdr-avatar{border-radius:50%;margin-left:6px;display:inline-flex}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:50;min-width:196px;padding:6px;background:var(--overlay-bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity 120ms ease-in,transform 120ms ease-in;pointer-events:none}

.menu-item:hover,.menu-item:focus-visible{background:var(--hover-bg);outline-offset:-2px}
.menu-item .ic{color:var(--fg-muted)}

.menu-item[aria-checked="true"] .check{opacity:1}
.menu-item .swatch-mini{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);flex:none}

/* =========================================================

   ========================================================= */
.tabnav{position:relative;border-bottom:1px solid var(--border-muted)}

.tab{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 8px;font-size:14px;color:var(--fg-muted);border-radius:var(--r);white-space:nowrap}

.tab:hover{color:var(--fg);text-decoration:none}
.tab:hover::before{opacity:1}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab[aria-current="page"] .ic{color:var(--fg)}

.profile-nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px)}
.profile-nav .tabnav{border-bottom:0}
.profile-nav-border{border-bottom:1px solid var(--border-muted)}
.profile-nav .container{display:flex;align-items:center;gap:32px}
.profile-nav .pn-offset{width:296px;flex:none;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(4px);transition:opacity var(--dur),transform var(--dur) var(--ease-out);font-weight:600;font-size:14px}
.profile-nav.stuck .pn-offset{opacity:1;transform:none}

/* =========================================================
   Profile
   ========================================================= */
.profile{display:grid;grid-template-columns:296px minmax(0,1fr);gap:32px;padding-top:32px;padding-bottom:64px}
.profile-side{position:relative}
.ps-avatar{position:relative;display:block;width:100%;max-width:296px}
.ps-avatar .avatar{--s:100%;width:100%;height:auto;aspect-ratio:1;font-size:88px;border:1px solid var(--border-muted);box-shadow:0 0 0 1px var(--canvas),var(--shadow-sm)}
.ps-status{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;font-size:12px;color:var(--fg-muted);background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-pill);box-shadow:var(--shadow-md);white-space:nowrap}
.ps-status .pulse{width:8px;height:8px;border-radius:50%;background:var(--success-fg);box-shadow:0 0 0 0 color-mix(in srgb,var(--success-fg) 50%,transparent);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--success-fg) 45%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ps-names{padding:16px 0}
.ps-name{display:flex;flex-direction:column}
.ps-full{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.ps-handle{font-size:20px;font-weight:300;line-height:24px;color:var(--fg-muted)}
.ps-bio{font-size:16px;line-height:1.5;margin-bottom:16px;text-wrap:pretty}
.ps-meta{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px;color:var(--fg-muted)}
.ps-meta li{display:flex;align-items:center;gap:8px}
.ps-meta .ic{color:var(--fg-subtle)}
.ps-meta strong{color:var(--fg);font-weight:600}
.ps-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border-muted)}
.ps-section h2{font-size:14px;font-weight:600;margin-bottom:10px}
.ps-links{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ps-links a{display:flex;align-items:center;gap:8px;color:var(--fg)}
.ps-links a .ic{color:var(--fg-subtle)}
.ps-links a:hover{color:var(--accent-fg);text-decoration:none}
.ps-langs{display:flex;flex-wrap:wrap;gap:6px}
.profile-main{min-width:0}
.readme-card{padding:24px;margin-bottom:24px}
.readme-card .rc-head{display:flex;align-items:center;gap:6px;font:12px var(--font-mono);color:var(--fg-subtle);margin-bottom:14px}
.pinned{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:32px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);transition:border-color var(--dur-quick),box-shadow var(--dur),transform var(--dur) var(--ease-out)}
.card:hover{border-color:var(--btn-border-hover);box-shadow:var(--shadow-md)}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.card-top .ic{color:var(--fg-muted)}
.card-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top .label{margin-left:auto}
.card-desc{flex:1;font-size:12px;line-height:1.55;color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-kind{font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--fg-subtle)}

/* Contribution graph */
.contrib{padding:16px 16px 12px}
.contrib-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.contrib-head h2{font-size:16px;font-weight:400}
.contrib-head h2 strong{font-weight:600}
.hm-scroll{overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:thin}
.hm{display:grid;grid-template-columns:28px auto;grid-template-rows:auto auto;column-gap:4px;width:max-content}
.hm-months{grid-column:2;display:grid;grid-template-columns:repeat(var(--weeks),var(--cell));column-gap:3px;height:18px;font-size:11px;color:var(--fg-muted)}
.hm-months span{white-space:nowrap}
.hm-days{grid-row:2;display:grid;grid-template-rows:repeat(7,var(--cell));row-gap:3px;font-size:11px;line-height:var(--cell);color:var(--fg-muted)}
.hm-grid{grid-row:2;grid-column:2;display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:3px}
.hm-cell{display:block;width:var(--cell);height:var(--cell);padding:0;border:0;border-radius:2.5px;background:var(--heat-0);box-shadow:inset 0 0 0 1px var(--heat-line);cursor:pointer;transition:transform 120ms var(--ease),box-shadow 120ms}
.hm-cell[data-l="1"]{background:var(--heat-1)}
.hm-cell[data-l="2"]{background:var(--heat-2)}
.hm-cell[data-l="3"]{background:var(--heat-3)}
.hm-cell[data-l="4"]{background:var(--heat-4)}
.hm-cell.hm-out{visibility:hidden;cursor:default}
.hm-cell:hover{transform:scale(1.25);box-shadow:inset 0 0 0 1px var(--heat-line),0 0 0 1px var(--canvas)}
.hm-cell:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:2.5px}
.hm-cell[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--fg);transform:scale(1.1)}
.hm.has-sel .hm-cell:not([aria-pressed="true"]):not(.hm-out){opacity:.45}
.hm-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--fg-muted)}
.hm-legend{display:flex;align-items:center;gap:3px}
.hm-legend i{width:var(--cell);height:var(--cell);border-radius:2.5px;background:var(--heat-0);box-shadow:inset 0 0 0 1px var(--heat-line)}
.hm-legend i:nth-child(3){background:var(--heat-1)}
.hm-legend i:nth-child(4){background:var(--heat-2)}
.hm-legend i:nth-child(5){background:var(--heat-3)}
.hm-legend i:nth-child(6){background:var(--heat-4)}
.hm-legend span{margin:0 4px}
.contrib-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border-muted);margin:12px -16px -12px}
.contrib-stats div{padding:12px 16px;border-right:1px solid var(--border-muted)}
.contrib-stats div:last-child{border-right:0}
.contrib-stats dt{font-size:12px;color:var(--fg-muted)}
.contrib-stats dd{margin:2px 0 0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* Activity feed */
.feed{margin-top:32px}
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;margin-bottom:8px}
.feed-head h2{font-size:16px;font-weight:500}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;font-size:12px;font-weight:500;color:var(--accent-fg);background:var(--accent-subtle);border:1px solid color-mix(in srgb,var(--accent-fg) 30%,transparent);border-radius:var(--r-pill);cursor:pointer}
.filter-chip .ic{width:14px;height:14px}
.filter-chip:hover{background:color-mix(in srgb,var(--accent-subtle) 70%,var(--accent-fg) 12%)}
.tl-day{position:relative;padding-left:0}
.tl-date{display:flex;align-items:center;gap:12px;margin:18px 0 10px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.tl-date::after{content:"";flex:1;height:1px;background:var(--border-muted)}
.tl-item{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:15.5px;top:32px;bottom:0;width:1px;background:var(--border-muted)}
.tl-item:last-child::before{display:none}
.tl-badge{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--canvas-subtle);border:1px solid var(--border-muted);color:var(--fg-muted)}
.tl-badge.b-post{color:var(--done-fg);background:var(--done-subtle);border-color:transparent}
.tl-badge.b-release{color:var(--success-fg);background:var(--success-subtle);border-color:transparent}
.tl-badge.b-issue{color:var(--success-fg)}
.tl-badge.b-pull{color:var(--done-fg)}
.tl-body{padding-top:6px;min-width:0}
.tl-title{color:var(--fg);font-size:14px}
.tl-title a{font-weight:600;color:var(--fg)}
.tl-title a:hover{color:var(--accent-fg)}
.tl-commits{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.tl-commits li{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--fg-muted);min-width:0}
.tl-commits code{font:12px var(--font-mono);color:var(--accent-fg);flex:none}
.tl-commits span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-card{display:block;margin-top:8px;padding:12px 14px;border:1px solid var(--border-muted);border-radius:var(--r-md);color:var(--fg);transition:border-color var(--dur-quick),background-color var(--dur-quick)}
.tl-card:hover{text-decoration:none;border-color:var(--border);background:var(--hover-bg)}
.tl-card strong{display:block;font-weight:600;margin-bottom:2px}
.tl-card span{font-size:13px;color:var(--fg-muted)}
.feed-more{display:flex;justify-content:center;margin-top:8px}
.empty{display:grid;justify-items:center;gap:8px;padding:40px 24px;text-align:center;color:var(--fg-muted)}
.empty .ic{width:24px;height:24px;color:var(--fg-subtle)}
.empty h3{font-size:16px;font-weight:600;color:var(--fg)}

/* Repositories / writing lists */
.list-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border-muted)}
.input{height:32px;padding:0 12px;font:14px var(--font-sans);color:var(--fg);background:var(--canvas);border:1px solid var(--border);border-radius:var(--r);transition:border-color var(--dur-quick),box-shadow var(--dur-quick)}
.input::placeholder{color:var(--fg-subtle)}
.input:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent);border-radius:var(--r)}
.list-toolbar .input{flex:1;min-width:180px}
.repo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:24px 0;border-bottom:1px solid var(--border-muted)}
.repo-row h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.repo-row p{color:var(--fg-muted);margin-bottom:10px;max-width:70ch}
.repo-row .topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.post-item{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;padding:20px 16px;border-bottom:1px solid var(--border-muted);transition:background-color var(--dur-quick)}
.post-item:last-child{border-bottom:0}
.post-item:hover{background:var(--hover-bg)}
.pi-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--done-fg);background:var(--done-subtle)}
.pi-title{font-size:16px;font-weight:600;line-height:1.35;margin-bottom:4px}
.pi-title a{color:var(--fg)}
.pi-title a::after{content:"";position:absolute;inset:0}
.pi-title a:hover{color:var(--accent-fg);text-decoration:none}
.pi-excerpt{color:var(--fg-muted);margin-bottom:10px;max-width:68ch;text-wrap:pretty}
.pi-meta{position:relative;z-index:1}
.pi-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--fg-muted)}
.pi-side span{display:inline-flex;align-items:center;gap:4px}

/* =========================================================
   Repo view
   ========================================================= */
.repo-head{background:var(--canvas-subtle);border-bottom:1px solid var(--border-muted)}
.repo-head .container{padding-top:16px}
.repo-title-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.repo-title{display:flex;align-items:center;gap:8px;font-size:20px;min-width:0}
.repo-title .ic{color:var(--fg-muted)}
.repo-title a{color:var(--accent-fg)}
.repo-title strong a{font-weight:600}
.repo-title .sep{color:var(--fg-subtle)}
.repo-actions{display:flex;gap:8px}
.repo-head .tabnav{border-bottom:0;margin-top:4px}
.repo-body{padding-top:24px;padding-bottom:64px}
.repo-grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px}
.code-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.code-toolbar .grow{flex:1}
.commit-row{gap:10px;font-size:13px}
.commit-row .msg{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.commit-row .sha{font:12px var(--font-mono);color:var(--fg-muted)}
.commit-row .grow{flex:1}
.commit-row .history{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:600;white-space:nowrap}
.commit-row .history .ic{color:var(--fg-muted)}
.tree{list-style:none;margin:0;padding:0}
.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 110px;align-items:center;gap:16px;min-height:40px;padding:0 16px 0 calc(8px + var(--lvl,0) * 20px);border-top:1px solid var(--border-muted);font-size:14px;transition:background-color var(--dur-quick)}
.tr:first-child{border-top:0}
.tr:hover{background:var(--hover-bg)}
.tr-main{display:flex;align-items:center;gap:6px;min-width:0;height:32px;padding:0 6px;color:var(--fg);background:none;border:0;border-radius:var(--r);cursor:pointer;text-align:left}
.tr-main:hover{text-decoration:none}
.tr-main:hover .tr-name{color:var(--accent-fg);text-decoration:underline;text-underline-offset:.2em}
.tr-main[aria-current="page"] .tr-name{font-weight:600;color:var(--accent-fg)}
.tr-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-chev{color:var(--fg-subtle);transition:transform var(--dur) var(--ease-out);width:14px;height:14px}
.tr-main[aria-expanded="true"] .tr-chev{transform:rotate(90deg)}
.tr-chev-space{width:14px;flex:none}
.tr-ic{color:var(--fg-subtle)}
.tr-ic.folder{color:var(--folder);fill:color-mix(in srgb,var(--folder) 30%,transparent)}
.tr-msg{color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-time{color:var(--fg-muted);text-align:right;white-space:nowrap;font-size:13px}
.tr-enter{animation:trIn var(--dur-slow) var(--ease-out) both;animation-delay:calc(var(--i,0) * 24ms)}
@keyframes trIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.viewer{margin-top:16px;scroll-margin-top:16px}
.viewer-head{justify-content:space-between;flex-wrap:wrap}
.viewer-head .vh-left{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.viewer-head .vh-left strong{font-weight:600}
.viewer-head .vh-right{display:flex;align-items:center;gap:6px}
.vh-crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.vh-crumbs .sep{color:var(--fg-subtle)}
.readme-body{padding:32px 40px}
.code-view{display:grid;grid-template-columns:auto minmax(0,1fr);font:13px/20px var(--font-mono);background:var(--canvas);border-radius:0 0 var(--r-md) var(--r-md)}
.code-view pre{margin:0;padding:12px 16px 16px;overflow:auto;font:inherit;tab-size:2}
.code-view .gutter{padding-right:12px;padding-left:16px;text-align:right;color:var(--fg-subtle);user-select:none;border-right:1px solid var(--border-muted);overflow:hidden}
.tile-open{display:grid;justify-items:start;gap:12px;padding:32px 40px}
.tile-open p{color:var(--fg-muted);max-width:60ch}
.side-section{padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--border-muted)}
.side-section:last-child{border-bottom:0}
.side-section h2{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:12px}
.side-desc{font-size:16px;line-height:1.5;margin-bottom:14px;text-wrap:pretty}
.side-link{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin-bottom:14px;word-break:break-all}
.side-topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.side-stats{list-style:none;margin:0;padding:0;display:grid;gap:8px;color:var(--fg-muted)}
.side-stats li{display:flex;align-items:center;gap:8px}
.side-stats strong{color:var(--fg);font-weight:600}
.release{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start}
.release .ic{color:var(--success-fg);margin-top:3px}
.release-name{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600;color:var(--fg)}
.release-date{font-size:12px;color:var(--fg-muted)}
.release+.release{margin-top:12px}
.releases-more{margin-top:12px}
.lang-bar{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;gap:2px;margin-bottom:12px;background:var(--canvas)}
.lang-bar span{background:var(--c);transform-origin:left;animation:grow .7s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lang-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px}
.lang-list li{display:inline-flex;align-items:center;gap:6px}
.lang-list strong{font-weight:600;color:var(--fg)}
.lang-list span{color:var(--fg-muted)}
.issue-head{display:flex;gap:16px;flex-wrap:wrap}
.seg-link{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px;font-size:14px;color:var(--fg-muted);background:none;border:0;cursor:pointer;border-radius:var(--r)}
.seg-link[aria-pressed="true"]{color:var(--fg);font-weight:600}
.seg-link:hover{color:var(--fg)}
.issue{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-top:1px solid var(--border-muted);transition:background-color var(--dur-quick)}
.issue:first-child{border-top:0}
.issue:hover{background:var(--hover-bg)}
.issue>.ic{margin-top:3px}
.issue .i-open{color:var(--success-fg)}
.issue .i-closed{color:var(--done-fg)}
.issue .i-merged{color:var(--done-fg)}
.issue .i-draft{color:var(--fg-subtle)}
.issue h3{display:inline;font-size:15px;font-weight:600;line-height:1.5;margin-right:6px}
.issue .tags{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.issue .i-meta{font-size:12px;color:var(--fg-muted);margin-top:4px}
.issue .i-comments{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-muted);align-self:start;margin-top:3px}
.insights-grid{margin:0 0 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{padding:16px}
.stat dt{font-size:12px;color:var(--fg-muted)}
.stat dd{margin:4px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding:16px 16px 0}
.bars span{flex:1;min-width:0;height:var(--h);min-height:2px;border-radius:3px 3px 0 0;background:var(--heat-3);transform-origin:bottom;animation:rise .6s var(--ease-out) both;animation-delay:calc(var(--i) * 14ms);transition:background-color var(--dur-quick)}
.bars span:hover{background:var(--heat-4)}
.bars span.zero{background:var(--heat-0)}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bars-axis{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:11px;color:var(--fg-subtle);border-top:1px solid var(--border-muted);margin-top:0}

/* =========================================================
   Post / discussion reading view
   ========================================================= */
.post-wrap{padding-top:24px;padding-bottom:80px}
.breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--fg-muted);margin-bottom:20px}
.breadcrumbs a{color:var(--fg-muted)}
.breadcrumbs a:hover{color:var(--accent-fg)}
.breadcrumbs .sep{color:var(--fg-subtle)}
.post-head{padding-bottom:20px;margin-bottom:28px;border-bottom:1px solid var(--border-muted)}
.post-head h1{font-size:32px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-bottom:14px;max-width:24ch;text-wrap:balance}
.post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--fg-muted)}
.post-meta a{color:var(--fg);font-weight:600}
.post-grid{display:grid;grid-template-columns:minmax(0,1fr) 256px;gap:56px;align-items:start}
.post-main{min-width:0;max-width:720px}
.post-aside{position:sticky;top:24px}
.outline-title{font-size:12px;font-weight:600;color:var(--fg-muted);margin-bottom:8px}
.outline{list-style:none;margin:0;padding:0;border-left:1px solid var(--border-muted)}
.outline a{position:relative;display:block;padding:5px 0 5px 14px;margin-left:-1px;font-size:13px;line-height:1.4;color:var(--fg-muted);border-left:2px solid transparent;transition:color var(--dur-quick),border-color var(--dur-quick)}
.outline a.lvl-3{padding-left:26px;font-size:12px}
.outline a:hover{color:var(--fg);text-decoration:none}
.outline a.active{color:var(--fg);font-weight:500;border-left-color:var(--accent-fg)}
.aside-meta{margin-top:24px;padding-top:16px;border-top:1px solid var(--border-muted);display:grid;gap:14px}
.aside-meta dt{font-size:12px;font-weight:600;color:var(--fg-muted);margin-bottom:6px}
.aside-meta dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.outline-mobile{display:none;margin-bottom:24px;border:1px solid var(--border);border-radius:var(--r-md)}
.outline-mobile summary{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 14px;font-weight:600;cursor:pointer;list-style:none}
.outline-mobile summary::-webkit-details-marker{display:none}
.outline-mobile summary .ic{transition:transform var(--dur) var(--ease-out);color:var(--fg-muted)}
.outline-mobile[open] summary .ic{transform:rotate(180deg)}
.outline-mobile .outline{margin:0 14px 12px}
.reactions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:32px;padding-top:20px;border-top:1px solid var(--border-muted)}
.reaction{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:13px;color:var(--fg-muted);background:transparent;border:1px solid var(--border);border-radius:var(--r-pill);cursor:pointer;transition:background-color var(--dur-quick),border-color var(--dur-quick),color var(--dur-quick),transform var(--dur-quick)}
.reaction:hover{background:var(--hover-bg);border-color:var(--btn-border-hover)}
.reaction:active{transform:scale(.96)}
.reaction[aria-pressed="true"]{color:var(--accent-fg);background:var(--accent-subtle);border-color:color-mix(in srgb,var(--accent-fg) 45%,transparent)}
.reaction .emoji{font-size:14px;line-height:1;display:inline-block}
.reaction.pop .emoji{animation:pop .42s var(--ease-out)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.reaction .n{font-weight:500;font-variant-numeric:tabular-nums}
.react-add{width:28px;height:28px;border-radius:50%;border:1px solid var(--border)}
.picker-wrap{position:relative}
.picker{position:absolute;bottom:calc(100% + 8px);left:0;z-index:20;display:flex;flex-wrap:wrap;width:max-content;max-width:calc(100vw - 48px);gap:2px;padding:4px;background:var(--overlay-bg);border:1px solid var(--border);border-radius:var(--r-pill);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px) scale(.96);transform-origin:bottom left;pointer-events:none;transition:opacity 120ms ease-in,transform 120ms ease-in}
.picker.open{opacity:1;transform:none;pointer-events:auto;transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.picker button{display:grid;place-items:center;width:34px;height:34px;font-size:18px;background:none;border:0;border-radius:50%;cursor:pointer;transition:transform var(--dur-quick),background-color var(--dur-quick)}
.picker button:hover{background:var(--hover-bg);transform:scale(1.15)}
.picker button[aria-pressed="true"]{background:var(--accent-subtle)}
.post-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
.post-nav a{display:grid;gap:4px;padding:16px;border:1px solid var(--border);border-radius:var(--r-md);color:var(--fg);transition:border-color var(--dur-quick),background-color var(--dur-quick)}
.post-nav a:hover{text-decoration:none;border-color:var(--btn-border-hover);background:var(--hover-bg)}
.post-nav small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted)}
.post-nav strong{font-weight:600}
.post-nav .next{text-align:right}
.post-nav .next small{justify-content:flex-end}
.reply{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;margin-top:28px}
.reply-box{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.reply-box header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;font-size:13px;color:var(--fg-muted);background:var(--canvas-subtle);border-bottom:1px solid var(--border-muted)}
.reply-box header a{color:var(--fg);font-weight:600}
.reply-box .reply-body{padding:14px;font-size:14px;line-height:1.6}
.author-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;font-size:11px;font-weight:500;color:var(--fg-muted);border:1px solid var(--border);border-radius:var(--r-pill)}

/* =========================================================
   Markdown body
   ========================================================= */
.markdown-body{font-size:16px;line-height:1.65;color:var(--fg);overflow-wrap:break-word}
.markdown-body>*:first-child{margin-top:0!important}
.markdown-body>*:last-child{margin-bottom:0!important}
.markdown-body p,.markdown-body ul,.markdown-body ol,.markdown-body .table-wrap,.markdown-body blockquote,.markdown-body .codeblock,.markdown-body .callout{margin:0 0 16px}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{position:relative;margin:28px 0 14px;font-weight:600;line-height:1.25;letter-spacing:-.01em;scroll-margin-top:24px}
.markdown-body h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
.markdown-body h2{font-size:1.45em;padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
.markdown-body h3{font-size:1.2em}
.markdown-body h4{font-size:1em}
.markdown-body .anchor{position:absolute;left:-26px;top:50%;display:grid;place-items:center;width:22px;height:22px;margin-top:-11px;color:var(--fg-muted);border-radius:var(--r-sm);opacity:0;transition:opacity var(--dur-quick)}
.markdown-body h2 .anchor,.markdown-body h1 .anchor{margin-top:calc(-11px - .15em)}
.markdown-body h1:hover .anchor,.markdown-body h2:hover .anchor,.markdown-body h3:hover .anchor,.markdown-body h4:hover .anchor,.markdown-body .anchor:focus-visible{opacity:1}
.markdown-body .anchor:hover{color:var(--accent-fg)}
.markdown-body h1:focus,.markdown-body h2:focus,.markdown-body h3:focus{outline:none}
.markdown-body a{color:var(--accent-fg);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.22em;text-decoration-thickness:1px;transition:text-decoration-color var(--dur-quick)}
.markdown-body a:hover{text-decoration-color:currentColor}
.markdown-body a.anchor{text-decoration:none}
.markdown-body strong{font-weight:600}
.markdown-body ul,.markdown-body ol{padding-left:1.6em}
.markdown-body li+li{margin-top:.3em}
.markdown-body li::marker{color:var(--fg-subtle)}
.markdown-body code{font:.85em/1.4 var(--font-mono);padding:.18em .4em;background:var(--code-inline-bg);border-radius:var(--r)}
.markdown-body hr{height:3px;margin:28px 0;background:var(--border-muted);border:0;border-radius:2px}
.markdown-body blockquote{padding:0 1em;color:var(--fg-muted);border-left:.25em solid var(--border)}
.table-wrap{overflow-x:auto;max-width:100%}
.markdown-body table{border-collapse:collapse;border-spacing:0;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;min-width:min(100%,420px)}
.markdown-body th,.markdown-body td{padding:7px 13px;border:1px solid var(--border)}
.markdown-body th{font-weight:600;text-align:left;background:var(--canvas-subtle)}
.markdown-body tbody tr:nth-child(2n){background:color-mix(in srgb,var(--canvas-subtle) 60%,transparent)}
.markdown-body td code{white-space:nowrap}
.markdown-body ul.tasks{list-style:none;padding-left:0}
.markdown-body li.task{display:flex;align-items:flex-start;gap:10px}
.checkbox{display:inline-grid;place-items:center;flex:none;width:16px;height:16px;margin-top:.3em;border:1px solid var(--border);border-radius:4px;background:var(--canvas)}
.task.done .checkbox{background:var(--accent-emphasis);border-color:var(--accent-emphasis);color:#fff}
.checkbox .ic{width:12px;height:12px;stroke-width:2.2}
.task.done>span:last-child{color:var(--fg-muted)}
.callout{--c:var(--accent-fg);padding:10px 16px 12px;border-left:.25em solid var(--c);border-radius:0 var(--r) var(--r) 0;background:color-mix(in srgb,var(--c) 5%,transparent)}
.callout>*:last-child{margin-bottom:0}
.callout p{margin-bottom:8px}
.callout-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--c);margin-bottom:6px!important}
.callout-tip{--c:var(--success-fg)}
.callout-important{--c:var(--done-fg)}
.callout-warning{--c:var(--attention-fg)}
.callout-caution{--c:var(--danger-fg)}
.codeblock{position:relative;background:var(--canvas-subtle);border:1px solid var(--border-muted);border-radius:var(--r-md)}
.codeblock pre{margin:0;padding:16px 18px;overflow:auto;font:13px/1.65 var(--font-mono);tab-size:2}
.codeblock pre:focus-visible{outline-offset:-2px;border-radius:var(--r-md)}
.codeblock code,.code-view code{font:inherit;padding:0;background:none;border-radius:0}
.codeblock-tools{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity var(--dur-quick)}
.codeblock:hover .codeblock-tools,.codeblock:focus-within .codeblock-tools{opacity:1}
@media (hover:none){.codeblock-tools{opacity:1}}
.codeblock-lang{font:11px var(--font-mono);color:var(--fg-subtle);padding:0 4px}
.copy-btn{position:relative;width:30px;height:30px;background:var(--canvas);border-color:var(--border)}
.copy-btn .ic-check{position:absolute;opacity:0;transform:scale(.6);color:var(--success-fg);transition:opacity var(--dur-quick),transform var(--dur) var(--ease-out)}
.copy-btn .ic-copy{transition:opacity var(--dur-quick),transform var(--dur) var(--ease-out)}
.copy-btn.copied .ic-check{opacity:1;transform:none}
.copy-btn.copied .ic-copy{opacity:0;transform:scale(.6)}
.copy-btn.copied{border-color:color-mix(in srgb,var(--success-fg) 50%,transparent)}
.tk-c{color:var(--syn-c);font-style:italic}
.tk-k{color:var(--syn-k)}
.tk-s{color:var(--syn-s)}
.tk-n{color:var(--syn-n)}
.tk-f{color:var(--syn-f)}
.tk-p{color:var(--syn-p)}
.tk-t{color:var(--syn-t)}
.mention{font-weight:600;color:var(--fg)!important}

/* =========================================================
   Overlays: tooltip, hovercard, toast, palette, dialogs
   ========================================================= */
.tip{position:fixed;z-index:90;max-width:260px;padding:6px 9px;font:500 12px/1.35 var(--font-sans);color:var(--tip-fg);background:var(--tip-bg);border-radius:var(--r);pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity 100ms,transform 100ms;white-space:nowrap}
.tip.show{opacity:1;transform:none}
.tip::after{content:"";position:absolute;left:var(--ax,50%);width:8px;height:8px;margin-left:-4px;background:inherit;transform:rotate(45deg);border-radius:1px}
.tip[data-side="top"]::after{bottom:-3px}
.tip[data-side="bottom"]::after{top:-3px}
.hovercard{position:fixed;z-index:80;width:320px;max-width:calc(100vw - 16px);padding:16px;background:var(--overlay-bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);transition:opacity 140ms ease-in,transform 140ms ease-in;pointer-events:none}
.hovercard.show{opacity:1;transform:none;pointer-events:auto;transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.hc-name{font-weight:600;font-size:15px;color:var(--fg)}
.hc-sub{color:var(--fg-muted);font-size:13px}
.hc-desc{color:var(--fg-muted);font-size:13px;line-height:1.5;margin-bottom:12px}
.hc-repo{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px;color:var(--fg)}
.hc-repo .ic{color:var(--fg-muted)}
.toast{position:fixed;left:50%;bottom:24px;z-index:95;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 16px 8px 10px;font-size:14px;font-weight:500;color:var(--tip-fg);background:var(--tip-bg);border-radius:var(--r-md);box-shadow:var(--shadow-lg);opacity:0;transform:translate(-50%,12px) scale(.98);pointer-events:none;transition:opacity 160ms ease-in,transform 160ms ease-in}
.toast.show{opacity:1;transform:translate(-50%,0);transition:opacity 220ms var(--ease-out),transform 280ms var(--ease-out)}
.toast-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--success-emphasis);color:#fff}
.toast-ic .ic{width:13px;height:13px;stroke-width:2.2}
.toast-ic.err{background:var(--danger-emphasis)}
.modal-root{position:fixed;inset:0;z-index:85}
.modal-root[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity 140ms ease-in}
.modal-root.open .backdrop{opacity:1;transition:opacity 200ms var(--ease-out)}
.palette,.dialog{position:absolute;left:50%;top:12vh;width:min(640px,calc(100vw - 32px));background:var(--overlay-bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;opacity:0;transform:translate(-50%,-8px) scale(.985);transition:opacity 120ms ease-in,transform 120ms ease-in}
.modal-root.open .palette,.modal-root.open .dialog{opacity:1;transform:translate(-50%,0);transition:opacity 180ms var(--ease-out),transform 220ms var(--ease-out)}
.palette-input{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-bottom:1px solid var(--border-muted)}
.palette-input .ic{color:var(--fg-subtle)}
.palette-input input{flex:1;min-width:0;height:100%;font:16px var(--font-sans);color:var(--fg);background:none;border:0;outline:none}
.palette-input input::placeholder{color:var(--fg-subtle)}
.palette-scope{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px;font-weight:500;color:var(--fg-muted);background:var(--counter-bg);border-radius:var(--r)}
.palette-list{max-height:min(420px,55vh);overflow-y:auto;padding:6px;overscroll-behavior:contain}
.pl-group{padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--fg-subtle)}
.pl-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:var(--r);cursor:pointer;color:var(--fg)}
.pl-item .ic{color:var(--fg-muted)}
.pl-item[aria-selected="true"]{background:var(--hover-bg);box-shadow:inset 2px 0 0 var(--accent-fg)}
[data-theme="light"] .pl-item[aria-selected="true"]{background:var(--n-2)}
.pl-item .pl-text{display:flex;flex-direction:column;min-width:0;flex:1}
.pl-item .pl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .pl-sub{font-size:12px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item mark{background:none;color:var(--accent-fg);font-weight:600}
.pl-item .pl-hint{font-size:12px;color:var(--fg-subtle);opacity:0}
.pl-item[aria-selected="true"] .pl-hint{opacity:1}
.palette-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 14px;font-size:12px;color:var(--fg-muted);border-top:1px solid var(--border-muted);background:var(--canvas-subtle)}
.palette-foot span{display:inline-flex;align-items:center;gap:6px}
.pl-empty{padding:32px 16px;text-align:center;color:var(--fg-muted)}
.dialog{top:10vh;width:min(720px,calc(100vw - 32px));max-height:80vh;display:flex;flex-direction:column}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-muted)}
.dialog-head h2{font-size:16px;font-weight:600}
.dialog-body{padding:8px 16px 20px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.sc-group h3{font-size:12px;font-weight:600;color:var(--fg-subtle);margin:14px 0 6px}
.sc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-muted);font-size:14px}
.sc-row:last-child{border-bottom:0}
.sc-keys{display:flex;gap:4px;align-items:center;color:var(--fg-subtle);font-size:12px}

/* =========================================================
   Skeletons, entrance
   ========================================================= */
.skel{position:relative;overflow:hidden;background:var(--skel);border-radius:var(--r)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--skel-shine),transparent);animation:shimmer 1.1s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-line{height:12px;margin:8px 0}
.skel-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border-muted)}
.skel-circle{width:32px;height:32px;border-radius:50%;flex:none}
.skel-stack{flex:1}
.enter{animation:enter var(--dur-slow) var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Star count roll */
.roll{display:inline-grid;overflow:hidden;height:18px;vertical-align:top}
.roll>span{grid-area:1/1}
.roll.up .old{animation:rollOutUp 260ms var(--ease-out) forwards}
.roll.up .new{animation:rollInUp 260ms var(--ease-out) both}
.roll.down .old{animation:rollOutDown 260ms var(--ease-out) forwards}
.roll.down .new{animation:rollInDown 260ms var(--ease-out) both}
@keyframes rollOutUp{to{transform:translateY(-100%);opacity:0}}
@keyframes rollInUp{from{transform:translateY(100%);opacity:0}}
@keyframes rollOutDown{to{transform:translateY(100%);opacity:0}}
@keyframes rollInDown{from{transform:translateY(-100%);opacity:0}}
.btn-star .star-ic{transition:fill var(--dur-quick),color var(--dur-quick)}
.btn-star.is-starred .star-ic{fill:#e3a008;color:#e3a008}
.btn-star.burst .star-ic{animation:starPop .5s var(--ease-out)}
@keyframes starPop{0%{transform:scale(1)}35%{transform:scale(1.4) rotate(-12deg)}100%{transform:scale(1)}}
.btn .counter{margin-left:2px;line-height:18px}

/* =========================================================
   Design tokens tab
   ========================================================= */
.dotted{background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--fg) 14%,transparent) 1px,transparent 0);background-size:14px 14px}
.cells-pattern{background:
  conic-gradient(from 90deg at 3px 3px,var(--heat-3) 90deg,transparent 0) 42px 28px/56px 42px,
  conic-gradient(from 90deg at 3px 3px,var(--heat-1) 90deg,var(--canvas) 0) 0 0/14px 14px}
.hatch{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--fg) 8%,transparent) 0 1px,transparent 1px 7px)}
.tk-hero{position:relative;padding:28px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:32px}
.tk-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--canvas) 30%,color-mix(in srgb,var(--canvas) 20%,transparent));pointer-events:none}
.tk-hero>*{position:relative;z-index:1}
.eyebrow{font:500 12px var(--font-mono);color:var(--fg-subtle);margin-bottom:8px}
.tk-hero h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.tk-hero p{color:var(--fg-muted);max-width:56ch;margin-bottom:18px;text-wrap:pretty}
.segmented{display:inline-flex;padding:3px;gap:2px;background:var(--canvas-subtle);border:1px solid var(--border);border-radius:var(--r-md)}
.segmented button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;font-size:13px;font-weight:500;color:var(--fg-muted);background:transparent;border:1px solid transparent;border-radius:var(--r);cursor:pointer;transition:background-color var(--dur-quick),color var(--dur-quick),box-shadow var(--dur-quick)}
.segmented button:hover{color:var(--fg)}
.segmented button[aria-checked="true"]{color:var(--fg);background:var(--canvas);border-color:var(--border);box-shadow:var(--shadow-sm)}
.tk-block{margin-bottom:40px}
.tk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:16px;font-weight:600;margin-bottom:4px}
.tk-sub{color:var(--fg-muted);margin-bottom:16px;max-width:64ch}
.swatch-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.swatch{display:flex;flex-direction:column;align-items:stretch;padding:0;text-align:left;background:var(--canvas);border:0;border-right:1px solid var(--border-muted);cursor:pointer;min-width:0}
.swatch:last-child{border-right:0}
.swatch:focus-visible{outline-offset:-3px;border-radius:var(--r-md)}
.sw-chip{display:block;height:72px;transition:transform var(--dur) var(--ease-out)}
.swatch:hover .sw-chip{transform:scaleY(1.06);transform-origin:top}
.sw-meta{display:flex;flex-direction:column;gap:1px;padding:8px 8px 10px;min-width:0}
.sw-name{font-size:12px;font-weight:600;color:var(--fg)}
.sw-hex{font:11px var(--font-mono);color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis}

<script type="text/markdown" id="md-readme-claude-feedback">
# claude-feedback

Leave comments directly on a running prototype, then hand them to an agent. **claude-feedback** is a local proxy that serves any dev server through a comment overlay and writes each comment, with a screenshot, to a JSON file.

> [!NOTE]
> Works with anything that serves HTML on localhost: Vite, Next, Astro, a static folder. Nothing is installed in the prototype itself.

## Quick start

```bash
npx claude-feedback --port 4599
# then open your prototype through the proxy
open http://localhost:4599/5173/
```

Alt-click any element to leave a comment. Pins stay attached to the element as the page changes.

## How it works

| Route | What it does |
| --- | --- |
| `/<port>/<path>` | Proxies `localhost:<port>/<path>` and injects the overlay into HTML |
| `/__feedback/overlay.js` | The overlay script and pin styles |
| `/__feedback/comments` | `GET` lists comments, `POST` adds one |

Comments land in `~/.claude-feedback/comments.json`:

```json
{
  "id": "c_01J8ZK2",
  "url": "/5173/pricing",
  "selector": "main > section:nth-child(2) > button",
  "body": "This should read Start free trial, not Sign up",
  "screenshot": "shots/c_01J8ZK2.png",
  "resolved": false
}
```

## Roadmap

- [x] Path-based routing, no DNS or certificates
- [x] Screenshot saved with every comment
- [ ] Re-anchor pins after web fonts load
- [ ] Keyboard-only comment flow
- [ ] Threaded replies

> [!TIP]
> Tell your agent: "Read the unresolved comments for this URL, look at each screenshot, fix the issues, then mark them resolved." That is the whole workflow.

## License

MIT. The story behind it: [Building a comment overlay for prototypes](#/post/comment-overlay).
</script>

<script type="text/markdown" id="md-readme-morning-briefing">
# Morning Briefing

An automated daily news digest. Every weekday at 6:15, it searches a fixed list of outlets, checks on running stories, and writes a briefing in plain paragraphs.

## Run it

```bash
uv sync
./run.sh --date today --out briefings/
```

## Layout

| Path | Purpose |
| --- | --- |
| `briefing/outlets.toml` | The search protocol: every outlet, in order |
| `briefing/search.py` | Fetches and filters results per outlet |
| `briefing/compose.py` | Groups stories into threads and writes the draft |
| `templates/briefing.md.j2` | The output format |

> [!IMPORTANT]
> Outlets marked `required = true` fail the run if they can't be reached. That's intentional: a briefing that quietly skipped a source is worse than none.

## Rules the output follows

- [x] Short paragraphs, one source each
- [x] Opinion pieces labeled as opinion
- [x] Running stories before new ones
- [ ] Paywalled outlets summarized from the free preview only

Retrospective: [What I learned shipping a daily news digest agent](#/post/news-digest-agent).

<script type="text/markdown" id="md-post-comment-overlay">
Every prototype review I ran this summer ended the same way: a screenshot in one window, a chat in another, and a sentence like "the second card, no, the one under it" that nobody could act on. I wanted the review to live *on* the prototype. Click the thing, say what's wrong, move on.

**claude-feedback** is the result: a local proxy that serves any dev server through a comment overlay, and writes every comment to a JSON file an agent can read.

## The shape of it

The proxy listens on one port and routes by path. `localhost:4599/5173/` serves whatever is running on 5173, with the overlay injected. No browser extension, no build plugin, nothing to install in the prototype.

| Piece | Job | Lines |
| --- | --- | ---: |
| `proxy.ts` | Route `/<port>/<path>` upstream, rewrite HTML | 41 |
| `inject.ts` | Add one script tag before the body closes | 12 |
| `overlay.ts` | Alt-click to comment, render pins | 118 |
| `store.ts` | Read and write `comments.json` | 37 |

> [!NOTE]
> Routing by path instead of subdomain means it works with zero DNS or certificate setup. The cost is that root-relative URLs in the prototype need rewriting, which is most of `proxy.ts`.

## Injecting without breaking things

The first version parsed the HTML to find the right insertion point. It was slow, and it broke on anything a framework streamed. The version that shipped is one regular expression and a fallback:

```ts
const CLOSE_BODY = /<\/body>/i;

export function injectOverlay(html: string, port: string): string {
  const tag = overlayTag(port);
  const at = html.search(CLOSE_BODY);
  return at === -1 ? html + tag : html.slice(0, at) + tag + html.slice(at);
}
```

Streaming responses are the one case this doesn't handle, and so far no prototype I've reviewed has needed them.

## Pinning comments to the DOM

A comment is only useful if it still points at the right element after the prototype changes. Each comment stores:

- a CSS selector, as short as it can be while still unique
- the element's text at the time, as a tiebreaker
- the viewport size and scroll offset
- a cropped screenshot of what I was looking at

The selector alone breaks when an agent reorders a list. The text alone breaks when copy changes. Together they re-anchor correctly in almost every case I've hit, and when they don't, the screenshot says what I meant.

> [!TIP]
> Alt-click turned out to be the right trigger. It never collides with the prototype's own click handlers, and it takes one sentence to explain.

### Why a JSON file

A database would have been more "correct." A file is something an agent already knows how to read, diff and edit, and something I can open when the overlay itself is broken.

## Screenshots as ground truth

Version 0.4 added a screenshot to every comment. It seemed like a nice-to-have until the first time an agent fixed the wrong button because two buttons had the same label. Now the loop is: read the comment, look at the crop, fix, set `resolved: true`.

## What's next

- [x] Comments survive a page reload
- [x] Screenshots saved alongside each comment
- [ ] Re-anchor pins when fonts finish loading ([#18](#/repo/claude-feedback/issues))
- [ ] A keyboard-only way to leave a comment
- [ ] Threads, so an agent can ask a clarifying question back

If you review prototypes with an agent in the loop, try it and tell me where it falls over. The issues are open, and @zc reads all of them.

<script type="text/markdown" id="md-post-news-digest-agent">
For ninety mornings, an agent has read the news before I have. It searches a fixed list of outlets, follows the stories it tracked yesterday, and writes a briefing that lands at 6:15. Here's what held up and what didn't.

## Protocols beat prompts

The first version had a clever prompt: "find the most important higher-ed stories." It found the loudest ones. What works now is boring and explicit: a protocol file that lists every outlet, in order, with what to search for on each.

```toml
[[outlet]]
name = "Inside Higher Ed"
search = ["international students", "visa", "global campus"]
required = true

[[outlet]]
name = "Times Higher Education"
search = ["branch campus", "partnership"]
required = true
```

> [!IMPORTANT]
> "Required" means the run fails loudly if the outlet can't be reached. A briefing that quietly skipped a source is worse than no briefing.

## Running stories are the product

Most mornings, the valuable part isn't the new story. It's the third day of an old one, when something changed. The agent keeps a small ledger of open threads and checks each one before it looks for anything new.

| Thread | Opened | Updates | Status |
| --- | --- | ---: | --- |
| Visa processing delays | Jun 11 | 14 | Open |
| Branch campus closures | Jul 2 | 6 | Open |
| Accreditation rule change | Jul 20 | 3 | Closed |

## Formatting is policy

I kept rewriting the output format, and eventually noticed that each rule was an editorial decision in disguise:

1. No bullet points. Every item is a short paragraph with a source.
2. No bold summaries. If the lede needs bolding, the lede is wrong.
3. Opinion pieces are labeled as opinion, every time.

Writing these down as rules rather than taste is what made the output stable from one day to the next.

## The hardest bug was a timezone

For two weeks, Monday's briefing included Saturday's news as "yesterday." The scheduler ran in UTC; the date math ran in local time. The fix was one line:

```python
since = datetime.now(ZoneInfo("America/New_York")).date() - timedelta(days=1)
```

> [!WARNING]
> If an agent does date arithmetic, give it the timezone explicitly. It will not ask.

## By the numbers

- 90 briefings, 3 missed runs, all three from an outlet timing out
- About 11 minutes per run, most of it waiting on search
- 1 reader, who now reads the news second
</script>

<script type="text/markdown" id="md-post-designing-for-motion">
These are working notes, kept while building the style tiles for this site. They're less a system than a list of things I keep relearning.

## Motion is a sentence

Every animation should have a subject (what moves), a verb (what it's doing) and a full stop (where it ends). If I can't say the sentence, the animation is decoration. "The tab indicator slides to the tab you picked" is a sentence. "Things fade in" is not.

## Durations

| Use | Duration | Easing |
| --- | ---: | --- |
| Hover, press | 120ms | `ease-out` |
| Tab indicator, toggles | 220ms | `cubic-bezier(.16, 1, .3, 1)` |
| Popovers, menus | 160ms in, 120ms out | `ease-out`, `ease-in` |
| Page-level transitions | 280ms | `cubic-bezier(.16, 1, .3, 1)` |

Exits should be faster than entrances. Nobody is waiting to watch something leave.

## Easing

Linear motion reads as mechanical, which is right for progress bars and almost nothing else. For anything that responds to the user, start fast and settle: most of the distance in the first third of the time.

```css
:root {
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-quick: 120ms;
  --dur-base: 220ms;
}

.tab-indicator {
  transition: transform var(--dur-base) var(--ease-out),
    width var(--dur-base) var(--ease-out);
}
```

## Reduced motion is a design

> [!NOTE]
> `prefers-reduced-motion` doesn't mean "no feedback." It means no travel. A crossfade still tells you something changed; a slide across the screen is what to remove.

```css
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}
```

The blanket rule above is a safety net, not the design. For each animation I write down its reduced version: slides become fades, counters change in place, skeletons stop shimmering.

## Checklist

- [x] Every animation has a sentence
- [x] Nothing moves further than it needs to
- [x] Exits faster than entrances
- [ ] Every tile checked with reduced motion on
- [ ] Every tile checked at 375px
</script>

<script type="text/plain" id="f-claude-feedback/src/proxy.ts">
import http from "node:http";
import { injectOverlay } from "./inject";
import { store } from "./store";

const PORT = Number(process.env.PORT ?? 4599);

// Route /<port>/<path> to http://localhost:<port>/<path>
const server = http.createServer(async (req, res) => {
  if (req.url?.startsWith("/__feedback")) return store.handle(req, res);

  const match = req.url?.match(/^\/(\d{2,5})(\/.*)?$/);
  if (!match) {
    res.writeHead(404).end("Expected /<port>/<path>");
    return;
  }

  const [, target, path = "/"] = match;
  const upstream = await fetch("http://localhost:" + target + path, {
    headers: { accept: req.headers.accept ?? "*/*" },
  });

  const type = upstream.headers.get("content-type") ?? "";
  res.writeHead(upstream.status, { "content-type": type });

  if (type.includes("text/html")) {
    res.end(injectOverlay(await upstream.text(), target));
  } else {
    res.end(Buffer.from(await upstream.arrayBuffer()));
  }
});

server.listen(PORT, () => {
  console.log("claude-feedback listening on http://localhost:" + PORT);
});
</script>
<script type="text/plain" id="f-claude-feedback/src/inject.ts">
const SCRIPT = "/__feedback/overlay.js";
const CLOSE_BODY = /<\/body>/i;

export function overlayTag(port: string): string {
  return '<script src="' + SCRIPT + '" data-port="' + port + '" defer><\/script>';
}

export function injectOverlay(html: string, port: string): string {
  const tag = overlayTag(port);
  const at = html.search(CLOSE_BODY);
  return at === -1 ? html + tag : html.slice(0, at) + tag + html.slice(at);
}
</script>
<script type="text/plain" id="f-claude-feedback/src/store.ts">
import { readFile, writeFile, mkdir } from "node:fs/promises";
import { homedir } from "node:os";
import { join } from "node:path";
import type { IncomingMessage, ServerResponse } from "node:http";

const DIR = join(homedir(), ".claude-feedback");
const FILE = join(DIR, "comments.json");

export interface Comment {
  id: string;
  url: string;
  selector: string;
  body: string;
  screenshot?: string;
  resolved: boolean;
}

async function load(): Promise<Comment[]> {
  try {
    return JSON.parse(await readFile(FILE, "utf8"));
  } catch {
    return [];
  }
}

export const store = {
  async handle(req: IncomingMessage, res: ServerResponse) {
    await mkdir(DIR, { recursive: true });
    const comments = await load();
    if (req.method === "POST") {
      let raw = "";
      for await (const chunk of req) raw += chunk;
      comments.push({ ...JSON.parse(raw), resolved: false });
      await writeFile(FILE, JSON.stringify(comments, null, 2));
    }
    res.writeHead(200, { "content-type": "application/json" });
    res.end(JSON.stringify(comments));
  },
};
</script>
<script type="text/plain" id="f-claude-feedback/src/overlay/overlay.ts">
// Runs inside the prototype. Alt-click any element to leave a comment.
import { toSelector } from "./selector";

document.addEventListener(
  "click",
  async (event) => {
    if (!event.altKey) return;
    event.preventDefault();
    const target = event.target as Element;
    const body = window.prompt("Comment on this element");
    if (!body) return;

    await fetch("/__feedback/comments", {
      method: "POST",
      body: JSON.stringify({
        id: crypto.randomUUID(),
        url: location.pathname,
        selector: toSelector(target),
        text: target.textContent?.trim().slice(0, 80),
        body,
      }),
    });
    target.setAttribute("data-feedback-pinned", "");
  },
  true,
);
</script>
<script type="text/plain" id="f-claude-feedback/src/overlay/selector.ts">
// Shortest selector that still matches exactly one element.
export function toSelector(el: Element): string {
  if (el.id) return "#" + CSS.escape(el.id);
  const parts: string[] = [];
  let node: Element | null = el;
  while (node && node !== document.body) {
    const parent: Element | null = node.parentElement;
    const index = parent ? Array.from(parent.children).indexOf(node) + 1 : 1;
    parts.unshift(node.tagName.toLowerCase() + ":nth-child(" + index + ")");
    if (document.querySelectorAll(parts.join(" > ")).length === 1) break;
    node = parent;
  }
  return parts.join(" > ");
}
</script>

<script type="text/plain" id="f-morning-briefing/briefing/search.py">
"""Search each outlet in protocol order and keep what matches."""
import tomllib
from dataclasses import dataclass
from pathlib import Path

PROTOCOL = Path(__file__).with_name("outlets.toml")


@dataclass
class Result:
    outlet: str
    title: str
    url: str
    published: str


def load_protocol() -> list[dict]:
    with PROTOCOL.open("rb") as f:
        return tomllib.load(f)["outlet"]


def search_all(client, since) -> list[Result]:
    results = []
    for outlet in load_protocol():
        hits = client.search(outlet["name"], outlet["search"], since=since)
        if not hits and outlet.get("required"):
            raise RuntimeError(f"Required outlet returned nothing: {outlet['name']}")
        results.extend(Result(outlet["name"], **hit) for hit in hits)
    return results
</script>
<script type="text/plain" id="f-morning-briefing/briefing/compose.py">
"""Group results into running threads and render the briefing."""
from collections import defaultdict
from jinja2 import Environment, FileSystemLoader

env = Environment(loader=FileSystemLoader("templates"))


def compose(results, ledger, date):
    threads = defaultdict(list)
    fresh = []
    for result in results:
        thread = ledger.match(result.title)
        (threads[thread] if thread else fresh).append(result)

    return env.get_template("briefing.md.j2").render(
        date=date,
        threads=dict(threads),
        fresh=fresh,
    )
</script>

// Cmd-K palette: fuzzy match over pages, posts and projects.
export function score(query: string, text: string): number {
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  const at = t.indexOf(q);
  if (at !== -1) return 100 - at;
  let i = 0;
  for (const ch of t) if (ch === q[i]) i++;
  return i === q.length ? 10 : -1;
}

  if (parts[0] === 'post' && POST[parts[1]]) return { v: 'post', slug: parts[1], section: parts[2] || null };
  return { v: '404' };
}
const TITLES = { overview: 'zc / site', repositories: 'Repositories · zc', writing: 'Writing · zc', tokens: 'Design tokens · zc' };
function route() {
  const r = parse(), prev = current;
  current = r;
  cleanups.forEach(fn => fn()); cleanups = [];
  hideHC(); hideTip(); closeMenu(); closePicker();
  const app = $('#app');
  if (r.v === 'profile' && prev && prev.v === 'profile') {
    if (prev.tab !== r.tab) {
      syncTabs($('#profile-nav .tabnav'), r.tab);
      swap($('#profile-content'), () => profileContent(r.tab), r.tab === 'tokens' ? 'grid' : 'list', () => afterProfile(r.tab));
      const nav = $('#profile-nav'), s = nav && nav.previousElementSibling; if (nav && s && nav.classList.contains('stuck')) window.scrollTo({ top: s.getBoundingClientRect().top + scrollY, behavior: 'auto' });
    }
  } else if (r.v === 'repo' && prev && prev.v === 'repo' && prev.repo === r.repo) {
    if (prev.tab !== r.tab) {
      if (r.tab === 'issues' || r.tab === 'pulls') issueState = 'open';
      syncTabs($('.repo-head .tabnav'), r.tab);
      swap($('#repo-content'), () => repoContent(r), r.tab === 'code' ? 'code' : 'list');
    } else if (r.tab === 'code' && !$('#tree')) {
      swap($('#repo-content'), () => repoContent(r), 'code');
    } else if (r.tab === 'code') {
      if (r.file) r.file.split('/').slice(0, -1).reduce((acc, p) => { const path = acc ? acc + '/' + p : p; OPEN_DIRS[r.repo].add(path); return path; }, '');
      $('#tree').innerHTML = treeRows(r.repo, TREES[r.repo], 0, '', r.file, null);
      const v = $('#viewer'); v.innerHTML = `<div class="enter">${viewerHTML(REPO[r.repo], r.file)}</div>`;
      v.setAttribute('aria-label', r.file || 'README');
      const top = v.getBoundingClientRect().top; if (r.file && (top < 0 || top > innerHeight * .6)) v.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
    }
  } else {
    if (r.v === 'repo' && r.file) r.file.split('/').slice(0, -1).reduce((acc, p) => { const path = acc ? acc + '/' + p : p; OPEN_DIRS[r.repo].add(path); return path; }, '');
    if (r.v === 'repo') issueState = 'open';
    app.innerHTML = '<div class="enter">' + (r.v === 'profile' ? viewProfile(r.tab) : r.v === 'repo' ? viewRepo(r) : r.v === 'post' ? viewPost(POST[r.slug]) : view404()) + '</div>';
    window.scrollTo(0, 0);
    if (r.v === 'profile') { syncTabs($('#profile-nav .tabnav'), r.tab, true); afterProfile(r.tab); watchStuck(); }
    if (r.v === 'repo') syncTabs($('.repo-head .tabnav'), r.tab, true);
    if (r.v === 'post') afterPost(r);
    if (prev) { const h = $('#page-title'); if (h) h.focus({ preventScroll: true }); }
  }
  document.title = r.v === 'profile' ? TITLES[r.tab] : r.v === 'repo' ? `zc/${r.repo}${r.file ? ' · ' + r.file : ''}` : r.v === 'post' ? POST[r.slug].title + ' · zc' : 'Not found · zc';
  renderBottomNav(r);
  $('#progress').classList.toggle('on', r.v === 'post');
}
function view404() {
  return `<div class="container" style="padding:64px 16px"><div class="box empty dotted" style="padding:64px 24px"><h1 id="page-title" tabindex="-1" style="font-size:24px">This page isn’t in the repo</h1><p>The link may be old, or the post may have moved.</p><a class="btn btn-primary" href="#/">Back to overview</a></div></div>`;
}
function afterProfile(tab) {
  if (tab === 'overview') { const sc = $('#hm-scroll'); if (sc) sc.scrollLeft = sc.scrollWidth; }
  if (tab === 'tokens') { fillHex(); const nav = $('.comp .tabnav'); if (nav) syncTabs(nav, 'a', true); }
}
function watchStuck() {
  const nav = $('#profile-nav'); if (!nav || !('IntersectionObserver' in window)) return;
  const sentinel = document.createElement('div'); sentinel.style.cssText = 'height:1px;margin-top:-1px'; nav.before(sentinel);
  const io = new IntersectionObserver(([en]) => nav.classList.toggle('stuck', !en.isIntersecting && en.boundingClientRect.top < 0));
  io.observe(sentinel); cleanups.push(() => io.disconnect());
}
function afterPost(r) {
  const body = $('#post-body');
  const heads = $$('h2[id], h3[id]', body);
  const links = $$('.outline a');
  const setActiveH = id => links.forEach(a => a.classList.toggle('active', a.dataset.scroll === id));
  if (heads.length) setActiveH(heads[0].id);
  const onScroll = () => {
    const y = 96; let cur = heads[0] && heads[0].id;
    for (const h of heads) { if (h.getBoundingClientRect().top - y <= 0) cur = h.id; else break; }
    setActiveH(cur);
    const rect = body.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (innerHeight * .35 - rect.top) / rect.height));
    $('#progress').style.transform = `scaleX(${p})`;
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  cleanups.push(() => { removeEventListener('scroll', onScroll); $('#progress').style.transform = 'scaleX(0)'; });
  if (r.section) { const h = document.getElementById(r.section); if (h) setTimeout(() => h.scrollIntoView({ block: 'start' }), 30); }
}
function renderBottomNav(r) {
  const items = [['overview', 'Home', 'home', '#/'], ['repositories', 'Repos', 'repo', '#/repositories'], ['writing', 'Writing', 'pencil', '#/writing'], ['tokens', 'Tokens', 'palette', '#/tokens']];
  const act = r.v === 'profile' ? r.tab : r.v === 'repo' ? 'repositories' : r.v === 'post' ? 'writing' : '';
  $('#bottom-nav').innerHTML = items.map(([id, label, ic, href]) => `<a class="bn-item" href="${href}"${act === id ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></a>`).join('') + `<button class="bn-item" type="button" data-palette aria-label="Search or jump to">${icon('search')}<span>Search</span></button>`;
}

/* ---------------------------------------------------------------
   Boot
--------------------------------------------------------------- */
setTheme(root.dataset.theme || 'light');
addEventListener('hashchange', route);
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resyncAllTabs);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resyncAllTabs, 80); });
})();
</script>
</body>
</html>
