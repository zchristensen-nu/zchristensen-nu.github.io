    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  var toastT;
  function toast(msg) {
    var t = $('#toast');
    t.innerHTML = I('check', 15) + '<span>' + esc(msg) + '</span>';
    t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }

  /* ================= Theme ================= */
  var themeBtn = $('#themeBtn');
  themeBtn.innerHTML = I('sun', 17) + I('moon', 17);
  function syncThemeLabel() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('zc-docs-theme', next); } catch (e) {}
    syncThemeLabel();
  });
  syncThemeLabel();

  /* ================= Top bar bits ================= */
  $('#navToggle').innerHTML = I('menu', 18);
  $('#modKey').textContent = MOD;
  $('#searchIcon').innerHTML = I('search', 18);
  $('#searchBtn').insertAdjacentHTML('afterbegin', I('search', 16));
  $$('.repo').forEach(function (r) {
    $('.repo-name', r).innerHTML = GH(15) + '<span>z-christensen/site</span>';
    $('.stars', r).innerHTML = I('star', 13) + '1.2k';
  });

  // version menu
  var VERS = [['v2026.09', 'Current', true], ['v2026.06', 'Jun 2026'], ['v2025.12', 'Dec 2025']];
  var verBtn = $('#verBtn'), verMenu = $('#verMenu'), ver = 'v2026.09';
  verBtn.insertAdjacentHTML('beforeend', I('chevD', 13));
  function renderVer() {
    verMenu.innerHTML = '<div class="menu-label">Documentation version</div>' + VERS.map(function (v) {
      return '<button class="menu-item" role="menuitemradio" aria-checked="' + (v[0] === ver) + '" data-v="' + v[0] + '" tabindex="-1">' + I('check', 14, 'tick') + '<span class="mono">' + v[0] + '</span>' + (v[2] ? '<span class="pill-latest">Latest</span>' : '') + '<span class="meta">' + v[1] + '</span></button>';
    }).join('');
    $$('.menu-item', verMenu).forEach(function (b) {
      b.addEventListener('click', function () { chooseVer(b.dataset.v); });
    });
  }
  function openVer(open) {
    verMenu.hidden = !open; verBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { var sel = $('.menu-item[aria-checked="true"]', verMenu) || $('.menu-item', verMenu); sel.focus(); }
  }
  function chooseVer(v) {
    ver = v; $('#verLabel').textContent = v; verBtn.setAttribute('aria-label', 'Documentation version, ' + v);
    renderVer(); openVer(false); verBtn.focus();
    var arch = $('#archived');
    if (v !== 'v2026.09') {
      arch.innerHTML = I('clock', 16) + '<span>You’re viewing archived docs for <strong>' + v + '</strong>. Some pages may describe older behavior.</span><button type="button" id="toLatest">Switch to latest</button>';
      arch.hidden = false;
      $('#toLatest').addEventListener('click', function () { chooseVer('v2026.09'); });
    } else { arch.hidden = true; }
    toast('Showing docs for ' + v);
  }
  renderVer();
  verBtn.addEventListener('click', function () { openVer(verMenu.hidden); });
  verBtn.addEventListener('keydown', function (e) { if (e.key === 'ArrowDown') { e.preventDefault(); openVer(true); } });
  verMenu.addEventListener('keydown', function (e) {
    var items = $$('.menu-item', verMenu), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); openVer(false); verBtn.focus(); }
    if (e.key === 'Tab') openVer(false);
  });
  document.addEventListener('click', function (e) {
    if (!verMenu.hidden && !e.target.closest('.ver')) openVer(false);
  });

  /* ================= Drawer ================= */
  var scrim = $('#scrim');
  function openDrawer() {
    document.body.classList.add('nav-open'); scrim.hidden = false;
    $('#navToggle').setAttribute('aria-expanded', 'true'); $('#navToggle').setAttribute('aria-label', 'Close navigation');
    var a = $('.nav-link[aria-current="page"]') || $('.nav-link'); setTimeout(function () { a.focus(); }, 60);
  }
  function closeDrawer() {
    if (!document.body.classList.contains('nav-open')) return;
    document.body.classList.remove('nav-open');
    $('#navToggle').setAttribute('aria-expanded', 'false'); $('#navToggle').setAttribute('aria-label', 'Open navigation');
    setTimeout(function () { if (!document.body.classList.contains('nav-open')) scrim.hidden = true; }, 260);
  }
  $('#navToggle').addEventListener('click', function () { document.body.classList.contains('nav-open') ? closeDrawer() : openDrawer(); });
  scrim.addEventListener('click', closeDrawer);

  /* ================= Search ================= */
  var INDEX = [];
  function buildIndex() {
    Object.keys(PAGES).forEach(function (id) {
      var p = PAGES[id];
      CUR = id;
      var html = p.render();
      var path = p.group ? 'Projects › ' + PROJ[p.group].title : p.crumbs.join(' › ');
      INDEX.push({ kind: p.kind === 'guide' ? 'Guides' : 'Pages', id: id, anchor: '', title: p.group ? PROJ[p.group].title + ' ' + p.title : p.title, path: path + (p.desc ? ' — ' + p.desc : ''), icon: p.kind === 'guide' ? 'pen' : p.kind === 'changelog' ? 'history' : 'doc' });
      var re = /<h([23]) id="([^"]+)" class="hx" data-t="([^"]*)"/g, m;
      while ((m = re.exec(html))) {
        INDEX.push({ kind: 'Sections', id: id, anchor: m[2], title: m[3].replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/&quot;/g, '"'), path: pageLabel(id), icon: 'hash' });
      }
    });
  }
  var sRoot = $('#search'), q = $('#q'), res = $('#results'), sel = 0, flat = [], lastFocus = null;
  function recent() { return store('zc-docs-recent') || []; }
  function addRecent(it) {
    var r = recent().filter(function (x) { return !(x.id === it.id && x.anchor === it.anchor); });
    r.unshift({ id: it.id, anchor: it.anchor, title: it.title, path: it.path, icon: it.icon });
    store('zc-docs-recent', r.slice(0, 5));
  }
  function mark(text, query) {
    var t = esc(text); if (!query) return t;
    var i = text.toLowerCase().indexOf(query.toLowerCase());
    if (i < 0) return t;
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + query.length)) + '</mark>' + esc(text.slice(i + query.length));
  }
  function search(query) {
    var qs = query.trim().toLowerCase();
    var groups = [];
    if (!qs) {
      var r = recent();
      if (r.length) groups.push({ name: 'Recent', clear: true, items: r.map(function (x) { x.icon = 'clock'; return x; }) });
      groups.push({ name: 'Suggested', items: ['cf-quickstart', 'cf-changelog', 'g-overlay', 'design-system'].map(function (id) { return INDEX.filter(function (x) { return x.id === id && !x.anchor; })[0]; }) });
    } else {
      var words = qs.split(/\s+/);
      var scored = INDEX.map(function (x) {
        var t = x.title.toLowerCase(), hay = (x.title + ' ' + x.path).toLowerCase();
        if (!words.every(function (w) { return hay.indexOf(w) > -1; })) return null;
        var s = t.indexOf(qs) === 0 ? 4 : t.indexOf(qs) > -1 ? 3 : words.every(function (w) { return t.indexOf(w) > -1; }) ? 2 : 1;
        return { x: x, s: s };
      }).filter(Boolean).sort(function (a, b) { return b.s - a.s; });
      ['Pages', 'Guides', 'Sections'].forEach(function (k) {
        var items = scored.filter(function (o) { return o.x.kind === k; }).slice(0, k === 'Sections' ? 8 : 5).map(function (o) { return o.x; });
        if (items.length) groups.push({ name: k, items: items });
      });
    }
    flat = [];
    if (!groups.length) {
      res.innerHTML = '<div class="r-empty">No results for <b>“' + esc(query) + '”</b>.<br>Try a project name, or a word like “install”.</div>';
      q.removeAttribute('aria-activedescendant');
      return;
    }
    res.innerHTML = groups.map(function (g) {
      var gid = uid('rg');
      return '<div role="group" aria-labelledby="' + gid + '"><div class="r-sec"><span id="' + gid + '">' + g.name + '</span>' + (g.clear ? '<button type="button" data-clear>Clear</button>' : '') + '</div>' + g.items.map(function (it) {
        var n = flat.length; flat.push(it);
        return '<div class="r-item" role="option" id="opt-' + n + '" data-n="' + n + '" aria-selected="false"><span class="r-ic">' + I(it.icon, 16) + '</span><span><span class="r-t">' + mark(it.title, query.trim()) + '</span><span class="r-p">' + esc(it.path) + '</span></span><span class="r-go">' + I('arrowR', 15) + '</span></div>';
      }).join('') + '</div>';
    }).join('');
    $$('.r-item', res).forEach(function (el) {
      el.addEventListener('mousemove', function () { select(+el.dataset.n, false); });
      el.addEventListener('click', function () { choose(+el.dataset.n); });
    });
    var c = $('[data-clear]', res);
    if (c) c.addEventListener('click', function () { store('zc-docs-recent', []); search(''); q.focus(); });
    select(0, false);
  }
  function select(n, scroll) {
    if (!flat.length) return;
    sel = (n + flat.length) % flat.length;
    $$('.r-item', res).forEach(function (el) { el.setAttribute('aria-selected', +el.dataset.n === sel ? 'true' : 'false'); });
    q.setAttribute('aria-activedescendant', 'opt-' + sel);
    if (scroll) { var el = $('#opt-' + sel); if (el) el.scrollIntoView({ block: 'nearest' }); }
  }
  function choose(n) {
    var it = flat[n]; if (!it) return;
    addRecent(it);
    closeSearch(false);
    var h = '#/' + it.id + (it.anchor ? '/' + it.anchor : '');
    if (location.hash === h) go(); else location.hash = h;
  }
  function openSearch() {
    if (!sRoot.hidden) return;
    lastFocus = document.activeElement;
    sRoot.hidden = false; q.value = ''; search('');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { q.focus(); }, 10);
  }
  function closeSearch(restore) {
    sRoot.hidden = true; document.body.style.overflow = '';
    if (restore !== false && lastFocus && lastFocus.focus) lastFocus.focus();
  }
  q.addEventListener('input', function () { search(q.value); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1, true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1, true); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(sel); }
  });
  sRoot.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
    if (e.key === 'Tab') {
      var f = $$('input, button', sRoot).filter(function (x) { return x.offsetParent !== null; });
      var i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  $$('[data-close]', sRoot).forEach(function (b) { b.addEventListener('click', function () { closeSearch(); }); });
  $('#searchBtn').addEventListener('click', openSearch);
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); sRoot.hidden ? openSearch() : closeSearch(); return; }
    var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (e.key === '/' && !typing && sRoot.hidden) { e.preventDefault(); openSearch(); return; }
    if (e.key === 'Escape') {
      if (document.body.classList.contains('nav-open')) { closeDrawer(); $('#navToggle').focus(); }
      if ($('#tocMBtn').getAttribute('aria-expanded') === 'true') { setTocOpen(false); $('#tocMBtn').focus(); }
    }
  });

  /* ================= Boot ================= */
  renderNav();
  buildIndex();
  TERMS = {};
  uidN = 0;
  go();
  reduceMQ.addEventListener && reduceMQ.addEventListener('change', function () { activeId = null; spy(); });
})();
</script>
</body>
</html>
