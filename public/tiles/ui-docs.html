<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z. Christensen — Docs</title>
<meta name="description" content="Projects and writing by Z. Christensen, organized like documentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('zc-docs-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root {
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-read: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --bg-muted: #f4f4f5;
  --bg-elev: #ffffff;
  --bg-blur: rgba(255,255,255,.82);
  --border: #e8e8eb;
  --border-strong: #d6d6da;
  --fg: #18181b;
  --fg-body: #3f3f46;
  --fg-muted: #52525b;
  --fg-subtle: #6b6b74;
  --accent: #3b50d6;
  --accent-hover: #3143bd;
  --accent-fg: #ffffff;
  --accent-soft: rgba(59,80,214,.075);
  --accent-line: rgba(59,80,214,.32);
  --node-on: #eef0fd;
  --note: #2563eb;  --note-bg: rgba(37,99,235,.055);  --note-line: rgba(37,99,235,.22);
  --tip: #15803d;   --tip-bg: rgba(21,128,61,.055);   --tip-line: rgba(21,128,61,.22);
  --warn: #b45309;  --warn-bg: rgba(217,119,6,.07);   --warn-line: rgba(217,119,6,.28);
  --danger: #dc2626;--danger-bg: rgba(220,38,38,.055);--danger-line: rgba(220,38,38,.24);
  --code-bg: #fafafa;
  --term-bg: #0f0f12;
  --term-fg: #e4e4e7;
  --tk-k: #7c3aed; --tk-s: #0f7a55; --tk-c: #8a8a93; --tk-n: #b45309; --tk-f: #2350c8;
  --shadow-sm: 0 1px 2px rgba(16,16,24,.04);
  --shadow-md: 0 1px 2px rgba(16,16,24,.04), 0 6px 16px -4px rgba(16,16,24,.07);
  --shadow-lg: 0 2px 4px rgba(16,16,24,.04), 0 16px 40px -8px rgba(16,16,24,.16);
  --shadow-xl: 0 0 0 1px rgba(16,16,24,.06), 0 24px 64px -12px rgba(16,16,24,.28);
  --dot: rgba(24,24,27,.13);
  --gridline: rgba(24,24,27,.055);
  --r-sm: 6px; --r: 8px; --r-lg: 12px; --r-xl: 16px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --topbar: 56px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0a0a0b;
  --bg-subtle: #0f0f11;
  --bg-muted: #18181b;
  --bg-elev: #121214;
  --bg-blur: rgba(10,10,11,.8);
  --border: #232327;
  --border-strong: #34343a;
  --fg: #ededef;
  --fg-body: #c9c9cf;
  --fg-muted: #a1a1aa;
  --fg-subtle: #8b8b94;
  --accent: #8b9cff;
  --accent-hover: #a3b1ff;
  --accent-fg: #0a0a0b;
  --accent-soft: rgba(139,156,255,.1);
  --accent-line: rgba(139,156,255,.4);
  --node-on: #171b35;
  --note: #60a5fa;  --note-bg: rgba(96,165,250,.07);  --note-line: rgba(96,165,250,.25);
  --tip: #4ade80;   --tip-bg: rgba(74,222,128,.06);   --tip-line: rgba(74,222,128,.22);
  --warn: #fbbf24;  --warn-bg: rgba(251,191,36,.06);  --warn-line: rgba(251,191,36,.24);
  --danger: #f87171;--danger-bg: rgba(248,113,113,.07);--danger-line: rgba(248,113,113,.26);
  --code-bg: #0f0f11;
  --term-bg: #0c0c0e;
  --tk-k: #c4b5fd; --tk-s: #86efac; --tk-c: #7c7c86; --tk-n: #fcd34d; --tk-f: #93c5fd;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px -4px rgba(0,0,0,.4);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.3), 0 16px 40px -8px rgba(0,0,0,.55);
  --shadow-xl: 0 0 0 1px rgba(255,255,255,.07), 0 24px 64px -12px rgba(0,0,0,.7);
  --dot: rgba(237,237,239,.12);
  --gridline: rgba(237,237,239,.05);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.6 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
  overflow-x: hidden;
  transition: background-color .25s var(--ease), color .25s var(--ease);
}
img, svg { display: block; }
.i { flex: none; display: inline-block; vertical-align: middle; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
::selection { background: var(--accent-line); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip {
  position: fixed; left: 12px; top: 10px; z-index: 200;
  padding: 8px 12px; border-radius: var(--r); background: var(--fg); color: var(--bg);
  font-weight: 500; font-size: 13px; text-decoration: none;
  transform: translateY(-160%); transition: transform .2s var(--ease);
}
.skip:focus-visible { transform: none; }

kbd, .kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  font: 500 11px/1 var(--font-ui);
  color: var(--fg-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar);
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px;
  background: var(--bg-blur);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.wordmark {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; font-weight: 600; letter-spacing: -.012em; font-size: 15px;
  padding: 4px 6px 4px 2px; margin-right: 4px; border-radius: var(--r);
  white-space: nowrap;
}
.logo {
  width: 24px; height: 24px; border-radius: 7px;
  display: grid; place-items: center;
  background: var(--fg); color: var(--bg);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.wm-sep { color: var(--border-strong); font-weight: 400; margin: 0 -2px; }
.wm-docs { color: var(--fg-subtle); font-weight: 500; }

.icon-btn {
  width: 34px; height: 34px; border-radius: var(--r);
  display: inline-grid; place-items: center; color: var(--fg-muted);
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.icon-btn:hover { background: var(--bg-muted); color: var(--fg); }
.nav-toggle { display: none; margin-left: -6px; }

.ver { position: relative; }
.ver-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 8px 0 10px;
  font: 500 12.5px/1 var(--font-mono);
  color: var(--fg-muted);
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg);
  transition: border-color .15s var(--ease), color .15s var(--ease);
}
.ver-btn:hover { border-color: var(--border-strong); color: var(--fg); }
.ver-btn .i { transition: transform .2s var(--ease); }
.ver-btn[aria-expanded="true"] .i { transform: rotate(180deg); }
.menu {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 80;
  min-width: 232px; padding: 6px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  transform-origin: top left;
  animation: pop .16s var(--ease-out);
}
.menu[hidden] { display: none; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu-label { padding: 6px 10px 4px; font-size: 11.5px; color: var(--fg-subtle); font-weight: 500; }
.menu-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-sm); text-align: left;
  font-size: 13.5px; color: var(--fg-body);
}
.menu-item:hover, .menu-item:focus-visible { background: var(--bg-muted); color: var(--fg); outline: none; }
.menu-item .mono { font-family: var(--font-mono); font-size: 12.5px; }
.menu-item .meta { margin-left: auto; font-size: 12px; color: var(--fg-subtle); }
.menu-item .tick { width: 14px; color: var(--accent); opacity: 0; }
.menu-item[aria-checked="true"] .tick { opacity: 1; }
.pill-latest {
  font: 500 10.5px/1 var(--font-ui); letter-spacing: .02em;
  padding: 3px 6px; border-radius: 999px;
  color: var(--tip); background: var(--tip-bg); border: 1px solid var(--tip-line);
}

.search-trigger {
  display: flex; align-items: center; gap: 8px;
  width: 280px; height: 34px; padding: 0 6px 0 10px; margin-left: 10px;
  color: var(--fg-subtle); font-size: 13.5px;
  background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--r);
  transition: border-color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease);
}
.search-trigger:hover { border-color: var(--border-strong); background: var(--bg); box-shadow: var(--shadow-sm); }
.search-trigger .st-label { flex: 1; text-align: left; }
.search-trigger .keys { display: inline-flex; gap: 3px; }
.spacer { flex: 1; }
.top-links { display: flex; gap: 2px; margin-right: 6px; }
.top-links a {
  font-size: 13.5px; color: var(--fg-muted); text-decoration: none;
  padding: 6px 10px; border-radius: var(--r-sm);
  transition: color .15s var(--ease), background-color .15s var(--ease);
}
.top-links a:hover { color: var(--fg); background: var(--bg-muted); }
.repo {
  display: inline-flex; align-items: stretch; height: 30px;
  font-size: 12.5px; text-decoration: none; color: var(--fg-muted);
  border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden;
  transition: border-color .15s var(--ease);
}
.repo:hover { border-color: var(--border-strong); color: var(--fg); }
.repo > span { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; }
.repo .repo-name { font-family: var(--font-mono); font-size: 12px; }
.repo .stars { border-left: 1px solid var(--border); background: var(--bg-subtle); font-weight: 500; font-variant-numeric: tabular-nums; }
.repo .stars .i { color: #d4a72c; }
.theme-btn .i-moon { display: none; }
[data-theme="dark"] .theme-btn .i-sun { display: none; }
[data-theme="dark"] .theme-btn .i-moon { display: block; }
.theme-btn .i { transition: transform .45s var(--ease-out); }
.theme-btn:active .i { transform: rotate(-30deg) scale(.9); }

/* ---------- Shell ---------- */
.shell {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) 240px;
  max-width: 1480px; margin: 0 auto;
}
.sidebar {
  position: sticky; top: var(--topbar);
  height: calc(100vh - var(--topbar));
  height: calc(100dvh - var(--topbar));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 24px 14px 72px 20px;
  border-right: 1px solid var(--border);
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  display: flex; flex-direction: column;
}
.nav-sec + .nav-sec { margin-top: 22px; }
.nav-label {
  display: block; padding: 0 10px 6px;
  font-size: 12px; font-weight: 600; color: var(--fg);
  letter-spacing: .005em;
}
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-link, .nav-group-btn {
  position: relative;
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 6px 10px; border-radius: var(--r-sm);
  font-size: 14px; line-height: 1.4; color: var(--fg-muted); text-decoration: none; text-align: left;
  transition: color .15s var(--ease), background-color .15s var(--ease);
}
.nav-link:hover, .nav-group-btn:hover { color: var(--fg); background: var(--bg-muted); }
.nav-link[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.nav-link .i, .nav-group-btn .i-lead { color: var(--fg-subtle); }
.nav-link[aria-current="page"] .i { color: var(--accent); }
.nav-group-btn .chev { margin-left: auto; color: var(--fg-subtle); transition: transform .2s var(--ease); }
.nav-group-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.nav-group-btn .gdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.nav-group-btn .nbadge { font: 500 10.5px/1 var(--font-mono); color: var(--fg-subtle); padding: 3px 5px; border: 1px solid var(--border); border-radius: 5px; }
.nav-sub {
  list-style: none; margin: 2px 0 6px 18px; padding: 0 0 0 10px;
  border-left: 1px solid var(--border);
  display: grid; gap: 1px;
  overflow: hidden;
}
.nav-sub[hidden] { display: none; }
.nav-sub .nav-link { font-size: 13.5px; padding: 5px 10px; }
.nav-sub .nav-link[aria-current="page"]::before {
  content: ""; position: absolute; left: -11px; top: 6px; bottom: 6px; width: 1px; background: var(--accent);
}
.nav-writing .nav-link { align-items: flex-start; }
.nav-writing .nav-link .i { margin-top: 2px; }
.side-foot {
  margin-top: auto; padding: 24px 10px 0;
  font-size: 12px; color: var(--fg-subtle);
  display: grid; gap: 10px;
}
.side-foot .repo { display: none; width: max-content; }
.scrim {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(10,10,12,.4);
  opacity: 0; transition: opacity .25s var(--ease);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.nav-open .scrim { opacity: 1; }

main { min-width: 0; padding: 40px 56px 120px; outline: none; }
.page { max-width: 760px; margin: 0 auto; transition: opacity .24s var(--ease), transform .3s var(--ease-out); }
.page.is-guide { max-width: 700px; }
.page.is-wide { max-width: 860px; }
.page.is-leaving { opacity: 0; transform: translateY(-4px); transition-duration: .14s, .14s; }
.page.is-entering { opacity: 0; transform: translateY(10px); transition: none; }

.toc {
  position: sticky; top: var(--topbar);
  height: calc(100vh - var(--topbar));
  overflow-y: auto; padding: 40px 24px 32px 8px;
  scrollbar-width: none;
}
.toc-title { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.toc-list { position: relative; border-left: 1px solid var(--border); }
.toc-ind {
  position: absolute; left: -1px; top: 0; width: 2px; height: 0; border-radius: 2px;
  background: var(--accent);
  transition: transform .32s var(--ease-out), height .32s var(--ease-out), opacity .2s;
  opacity: 0;
}
.toc-list a, .toc-m-panel a {
  display: block; padding: 5px 0 5px 14px;
  font-size: 13px; line-height: 1.45; color: var(--fg-subtle); text-decoration: none;
  transition: color .15s var(--ease);
}
.toc-list a:hover, .toc-m-panel a:hover { color: var(--fg); }
.toc-list a.lvl3, .toc-m-panel a.lvl3 { padding-left: 26px; font-size: 12.5px; }
.toc-list a.is-active, .toc-m-panel a.is-active { color: var(--fg); font-weight: 500; }
.toc-extra { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: grid; gap: 4px; }
.toc-extra a, .toc-extra button {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-subtle); text-decoration: none; padding: 3px 0; width: max-content;
  transition: color .15s var(--ease);
}
.toc-extra a:hover, .toc-extra button:hover { color: var(--fg); }

.toc-m { display: none; position: sticky; top: var(--topbar); z-index: 30; margin: -40px -56px 28px; padding: 0 56px; background: var(--bg-blur); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.toc-m-btn { display: flex; width: 100%; align-items: center; gap: 8px; height: 44px; font-size: 13px; color: var(--fg-muted); text-align: left; }
.toc-m-btn .lbl { font-weight: 500; color: var(--fg); white-space: nowrap; }
.toc-m-btn .cur { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-subtle); }
.toc-m-btn .i { transition: transform .2s var(--ease); }
.toc-m-btn[aria-expanded="true"] .i { transform: rotate(180deg); }
.toc-m-panel { padding: 4px 0 14px; max-height: 55vh; overflow-y: auto; border-left: 0; }
.toc-m-panel a { border-left: 2px solid transparent; }
.toc-m-panel a.is-active { border-left-color: var(--accent); }
.toc-m.is-empty { display: none !important; }

.archived {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  max-width: 760px; margin: 0 auto 28px; padding: 10px 14px;
  font-size: 13.5px; color: var(--fg-body);
  border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: var(--r);
}
.archived[hidden] { display: none; }
.archived .i { color: var(--warn); }
.archived button { margin-left: auto; font-weight: 500; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }

/* ---------- Doc typography ---------- */
.crumbs ol { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--fg-subtle); }
.crumbs li { display: inline-flex; align-items: center; gap: 6px; }
.crumbs li + li::before { content: ""; width: 5px; height: 5px; border-right: 1.25px solid var(--border-strong); border-top: 1.25px solid var(--border-strong); transform: rotate(45deg); margin-right: 4px; }
.crumbs li[aria-current] { color: var(--fg-muted); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--fg); }

.page h1 { font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -.028em; margin: 0 0 12px; text-wrap: balance; }
.lede { font-size: 17px; line-height: 1.6; color: var(--fg-muted); margin: 0 0 8px; max-width: 64ch; text-wrap: pretty; }
.doc-head { margin-bottom: 36px; }
.hx { position: relative; scroll-margin-top: calc(var(--topbar) + 28px); }
.page h2 { font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.018em; margin: 56px 0 12px; }
.page h3 { font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; margin: 36px 0 10px; }
.page h2 + h3 { margin-top: 20px; }
.hx .anchor {
  display: inline-grid; place-items: center; width: 24px; height: 24px; margin-left: 6px;
  vertical-align: 1px;
  border-radius: var(--r-sm);
  font: 500 15px/1 var(--font-ui); color: var(--fg-subtle); text-decoration: none;
  opacity: 0; transition: opacity .15s var(--ease), color .15s var(--ease), background-color .15s var(--ease);
}
.hx:hover .anchor, .hx .anchor:focus-visible { opacity: 1; }
.hx .anchor:hover { color: var(--accent); background: var(--accent-soft); }
@media (hover: none) { .hx .anchor { opacity: .45; } }

.prose p, .prose li { color: var(--fg-body); font-size: 15.5px; line-height: 1.72; }
.prose p { margin: 0 0 16px; }
.prose ul, .prose ol { padding-left: 22px; margin: 0 0 16px; }
.prose li { margin: 4px 0; padding-left: 4px; }
.prose li::marker { color: var(--fg-subtle); }
.prose strong { color: var(--fg); font-weight: 600; }
.prose a:not([class]), .link {
  color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent-line);
  text-decoration-thickness: 1px; text-underline-offset: 3px;
  transition: text-decoration-color .15s var(--ease), color .15s var(--ease);
}
.prose a:not([class]):hover, .link:hover { color: var(--accent); text-decoration-color: var(--accent); }
.prose :not(pre) > code, .ic {
  font: 500 .86em/1 var(--font-mono);
  padding: .18em .38em; border-radius: 5px;
  background: var(--bg-muted); border: 1px solid var(--border);
  color: var(--fg);
  word-break: break-word;
}
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  margin: 0 0 40px; padding: 44px 40px 36px;
  border: 1px solid var(--border); border-radius: var(--r-xl);
  isolation: isolate;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background:
    radial-gradient(60% 90% at 88% 0%, rgba(99,112,241,.20), transparent 60%),
    radial-gradient(50% 80% at 70% 110%, rgba(45,190,170,.14), transparent 60%),
    radial-gradient(40% 60% at 0% 0%, rgba(244,174,120,.12), transparent 60%),
    var(--bg-subtle);
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
[data-theme="dark"] .hero::after { opacity: .22; mix-blend-mode: overlay; }
.hero .hero-grid {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(80% 100% at 100% 0%, #000 10%, transparent 70%);
  mask-image: radial-gradient(80% 100% at 100% 0%, #000 10%, transparent 70%);
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 12.5px/1 var(--font-ui); color: var(--fg-muted);
  padding: 6px 10px 6px 8px; margin-bottom: 18px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm);
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tip); box-shadow: 0 0 0 3px var(--tip-bg); }
.hero h1 { font-size: 40px; letter-spacing: -.035em; margin-bottom: 12px; }
.hero .lede { font-size: 17.5px; max-width: 54ch; color: var(--fg-body); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 28px; padding-top: 18px; border-top: 1px dashed var(--border-strong); font-size: 12.5px; color: var(--fg-subtle); }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta b { font-weight: 500; color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: var(--r);
  font: 500 14px/1 var(--font-ui); text-decoration: none; white-space: nowrap;
  border: 1px solid transparent;
  transition: background-color .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), transform .1s var(--ease), color .15s var(--ease);
}
.btn .i { transition: transform .2s var(--ease); }
.btn:hover .i-arrowR { transform: translateX(2px); }
.btn:active, .btn.is-active { transform: translateY(1px); }
.btn-primary { background: var(--fg); color: var(--bg); box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.12); }
.btn-primary:hover, .btn-primary.is-hover { background: color-mix(in srgb, var(--fg) 86%, var(--bg)); }
.btn-accent { background: var(--accent); color: var(--accent-fg); }
.btn-accent:hover, .btn-accent.is-hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-elev); color: var(--fg); border-color: var(--border); box-shadow: var(--shadow-sm); }
.btn-secondary:hover, .btn-secondary.is-hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.btn-ghost { color: var(--fg-muted); }
.btn-ghost:hover, .btn-ghost.is-hover { background: var(--bg-muted); color: var(--fg); }
.btn.is-focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled, .btn.is-disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }

/* ---------- Cards ---------- */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin: 20px 0 8px; }
.cards.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.card {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  padding: 18px 18px 18px; border-radius: var(--r-lg);
  background: var(--bg-elev); border: 1px solid var(--border);
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform .22s var(--ease-out), box-shadow .22s var(--ease-out), border-color .22s var(--ease-out);
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.card:active { transform: translateY(0); box-shadow: var(--shadow-md); }
.card-icon {
  width: 32px; height: 32px; border-radius: 9px; margin-bottom: 8px;
  display: grid; place-items: center; color: var(--accent);
  background: var(--accent-soft); border: 1px solid var(--accent-line);
}
.card-t { font-weight: 600; font-size: 14.5px; letter-spacing: -.005em; display: flex; align-items: center; gap: 6px; }
.card-d { font-size: 13.5px; line-height: 1.55; color: var(--fg-muted); }
.card-arrow { position: absolute; top: 18px; right: 18px; color: var(--fg-subtle); opacity: 0; transform: translateX(-4px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
.card:hover .card-arrow, .card:focus-visible .card-arrow { opacity: 1; transform: none; }

/* ---------- Callouts ---------- */
.callout {
  display: grid; grid-template-columns: 20px 1fr; gap: 12px;
  margin: 20px 0; padding: 14px 16px;
  border: 1px solid var(--co-line); border-radius: var(--r-lg);
  background: var(--co-bg);
}
.callout .co-icon { color: var(--co); padding-top: 2px; }
.callout .co-title { margin: 0 0 2px; font-weight: 600; font-size: 14px; color: var(--fg); }
.callout .co-body p { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--fg-body); }
.callout-note { --co: var(--note); --co-bg: var(--note-bg); --co-line: var(--note-line); }
.callout-tip { --co: var(--tip); --co-bg: var(--tip-bg); --co-line: var(--tip-line); }
.callout-warning { --co: var(--warn); --co-bg: var(--warn-bg); --co-line: var(--warn-line); }
.callout-danger { --co: var(--danger); --co-bg: var(--danger-bg); --co-line: var(--danger-line); }

/* ---------- Steps ---------- */
.steps { list-style: none; margin: 24px 0; padding: 0; counter-reset: none; }
.steps > li { margin: 0; padding-left: 0; position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 16px; padding-bottom: 26px; }
.steps > li:last-child { padding-bottom: 4px; }
.steps > li:not(:last-child)::before {
  content: ""; position: absolute; left: 13.5px; top: 34px; bottom: 4px; width: 1px;
  background: linear-gradient(var(--border-strong), var(--border));
}
.step-n {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  font: 600 12.5px/1 var(--font-mono); color: var(--fg);
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  box-shadow: 0 0 0 4px var(--bg);
  font-variant-numeric: tabular-nums;
}
.step-c { padding-top: 3px; min-width: 0; }
.steps .step-t { margin: 0 0 4px; font-weight: 600; font-size: 15px; color: var(--fg); }
.step-c p { margin: 0 0 10px; font-size: 14.5px; }
.step-c > :last-child { margin-bottom: 0; }

/* ---------- Code ---------- */
.code, .codetabs {
  margin: 18px 0; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--code-bg); overflow: hidden;
}
.code-head {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 14px;
  border-bottom: 1px solid var(--border); background: var(--bg-elev);
  font-size: 12.5px; color: var(--fg-subtle);
}
.code-head .file { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 8px; }
.code-head .lang { margin-left: auto; font: 500 11px/1 var(--font-mono); text-transform: lowercase; color: var(--fg-subtle); }
pre {
  margin: 0; padding: 14px 16px; overflow-x: auto;
  font: 400 13px/22px var(--font-mono); color: var(--fg);
  tab-size: 2;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
pre code { font: inherit; }
.tk-k { color: var(--tk-k); }
.tk-s { color: var(--tk-s); }
.tk-c { color: var(--tk-c); font-style: italic; }
.tk-n { color: var(--tk-n); }
.tk-f { color: var(--tk-f); }
.copy-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--r-sm);
  font-size: 12px; color: var(--fg-subtle);
  transition: color .15s var(--ease), background-color .15s var(--ease);
}
.copy-btn:hover { color: var(--fg); background: var(--bg-muted); }
.copy-btn .i-check { display: none; color: var(--tip); }
.copy-btn.is-copied .i-copy { display: none; }
.copy-btn.is-copied .i-check { display: inline-block; animation: pop .2s var(--ease-out); }
.code-head .copy-btn { margin-left: 4px; }

.ct-tabs { position: relative; display: flex; align-self: stretch; gap: 2px; }
.ct-tab {
  position: relative; padding: 0 10px; height: 40px;
  font: 500 12.5px/1 var(--font-mono); color: var(--fg-subtle);
  transition: color .15s var(--ease);
}
.ct-tab:hover { color: var(--fg); }
.ct-tab[aria-selected="true"] { color: var(--fg); }
.ct-tab:focus-visible { outline-offset: -4px; }
.ct-ind { position: absolute; bottom: -1px; left: 0; height: 2px; width: 0; background: var(--fg); border-radius: 2px; transition: transform .28s var(--ease-out), width .28s var(--ease-out); }
.codetabs .code-head { padding-left: 4px; }
.ct-panel[hidden] { display: none; }

/* Terminal */
.term {
  margin: 18px 0; border-radius: var(--r-lg); overflow: hidden;
  background: var(--term-bg); color: var(--term-fg);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: var(--shadow-md);
}
[data-theme="dark"] .term { border-color: var(--border); }
.term-head { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 6px 0 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
.term-dots { display: flex; gap: 6px; }
.term-dots i { width: 10px; height: 10px; border-radius: 50%; background: #34343b; }
.term-title { flex: 1; text-align: center; font: 500 12px/1 var(--font-mono); color: #8e8e98; }
.term .copy-btn, .term .t-replay { color: #9a9aa4; }
.term .copy-btn:hover, .term .t-replay:hover { color: #fff; background: rgba(255,255,255,.07); }
.t-replay { width: 28px; height: 28px; border-radius: var(--r-sm); display: inline-grid; place-items: center; transition: color .15s, background-color .15s; }
.term pre { color: var(--term-fg); padding: 14px 16px 16px; min-height: calc(var(--lines, 3) * 22px + 30px); }
.term .p { color: #6ee7b7; user-select: none; }
.term .p-path { color: #93a4ff; user-select: none; }
.term .l { display: block; animation: lineIn .22s var(--ease-out) both; }
.term .l-dim { color: #8b8b95; }
.term .l-ok { color: #86efac; }
.term .l-acc { color: #c7d0ff; }
.term .l-warn { color: #fcd34d; }
.caret { display: inline-block; width: 7.5px; height: 15px; margin-left: 1px; vertical-align: -2px; background: #d4d4d8; animation: blink 1.05s steps(1) infinite; }
.term.typed .t-first-caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes lineIn { from { opacity: 0; transform: translateY(2px); } }

/* ---------- Param table ---------- */
.table-wrap { margin: 18px 0; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
table.params { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.params th { text-align: left; font-weight: 500; font-size: 12px; color: var(--fg-subtle); padding: 10px 14px; background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
.params td { vertical-align: top; padding: 14px; border-bottom: 1px solid var(--border); color: var(--fg-body); line-height: 1.55; }
.params tr:last-child td { border-bottom: 0; }
.params tbody tr { transition: background-color .15s var(--ease); }
.params tbody tr:hover { background: var(--bg-subtle); }
.p-name { font: 500 13px/1.4 var(--font-mono); color: var(--fg); white-space: nowrap; }
.p-req { display: block; margin-top: 6px; font: 500 11px/1 var(--font-ui); color: var(--danger); }
.p-opt { display: block; margin-top: 6px; font: 500 11px/1 var(--font-ui); color: var(--fg-subtle); }
.p-def { font: 400 12.5px/1.4 var(--font-mono); color: var(--fg-muted); white-space: nowrap; }
.tpill {
  display: inline-block; padding: 3px 7px; border-radius: 6px;
  font: 500 11.5px/1.3 var(--font-mono); white-space: nowrap;
  color: var(--tp); background: color-mix(in srgb, var(--tp) 9%, transparent); border: 1px solid color-mix(in srgb, var(--tp) 22%, transparent);
}
.t-str { --tp: var(--tip); }
.t-num { --tp: var(--warn); }
.t-bool { --tp: #8b5cf6; }
[data-theme="dark"] .t-bool { --tp: #c4b5fd; }
.t-fn { --tp: var(--note); }
.t-arr { --tp: #0e7490; }
[data-theme="dark"] .t-arr { --tp: #67e8f9; }
.t-obj { --tp: var(--fg-muted); }

/* ---------- Diagram ---------- */
.diagram { margin: 22px 0; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--bg-elev); }
.dg-canvas {
  position: relative; overflow-x: auto; padding: 22px 18px 10px;
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px;
  scrollbar-width: thin;
}
.dg-canvas svg { width: 100%; min-width: 580px; height: auto; overflow: visible; }
.dg-edge { fill: none; stroke: var(--border-strong); stroke-width: 1.5; transition: stroke .2s var(--ease), opacity .2s var(--ease); }
.dg-label { font: 500 10.5px var(--font-mono); fill: var(--fg-subtle); transition: fill .2s var(--ease), opacity .2s var(--ease); }
.dg-node { cursor: pointer; outline: none; transition: opacity .2s var(--ease); }
.dg-node rect.box { fill: var(--bg-elev); stroke: var(--border-strong); stroke-width: 1; transition: fill .2s var(--ease), stroke .2s var(--ease); }
.dg-node .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.dg-node:focus-visible .ring { opacity: 1; }
.dg-t { font: 600 13px var(--font-ui); fill: var(--fg); }
.dg-s { font: 400 11px var(--font-mono); fill: var(--fg-subtle); }
.dg-dot { transition: r .2s var(--ease); }
.diagram.has-active .dg-node:not(.is-on) { opacity: .42; }
.diagram.has-active .dg-edge:not(.is-on) { opacity: .35; }
.diagram.has-active .dg-label:not(.is-on) { opacity: .35; }
.dg-node.is-on rect.box { fill: var(--node-on); stroke: var(--accent); }
.dg-edge.is-on { stroke: var(--accent); stroke-dasharray: 5 5; animation: flow 1s linear infinite; }
.dg-label.is-on { fill: var(--accent); }
@keyframes flow { to { stroke-dashoffset: -20; } }
.dg-panel {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline;
  padding: 14px 18px; border-top: 1px solid var(--border); background: var(--bg-subtle); min-height: 76px;
}
.dg-panel .dp-k { font: 500 11px/1 var(--font-mono); color: var(--fg-subtle); padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elev); }
.dg-panel .dp-t { font-weight: 600; font-size: 14px; }
.dg-panel .dp-d { grid-column: 2; margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--fg-muted); }
.dg-hint { font-size: 12px; color: var(--fg-subtle); padding: 0 18px 12px; display: flex; gap: 6px; align-items: center; }

/* ---------- Changelog ---------- */
.cl-head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.cl-entry { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 0 32px; }
.cl-rail { position: relative; padding-top: 58px; }
.cl-rail-in { position: sticky; top: calc(var(--topbar) + 28px); display: grid; gap: 8px; justify-items: start; }
.cl-rail time { font-size: 13px; font-weight: 500; color: var(--fg-muted); }
.ver-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 12px/1 var(--font-mono); color: var(--fg);
  padding: 5px 8px; border-radius: 6px; background: var(--bg-muted); border: 1px solid var(--border);
}
.ver-tag.is-latest { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.cl-body { position: relative; padding: 0 0 56px 32px; border-left: 1px solid var(--border); min-width: 0; }
.cl-body::before {
  content: ""; position: absolute; left: -5px; top: 64px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--border-strong);
}
.cl-entry:first-of-type .cl-body::before { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.cl-body h2 { margin-top: 56px; }
.cl-list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
.cl-list li { display: grid; grid-template-columns: 78px 1fr; gap: 12px; align-items: baseline; font-size: 14.5px; line-height: 1.6; color: var(--fg-body); padding: 0; margin: 0; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: 999px;
  font: 500 11.5px/1 var(--font-ui); white-space: nowrap; width: max-content;
  color: var(--cc); background: color-mix(in srgb, var(--cc) 9%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 24%, transparent);
}
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.chip-new { --cc: var(--tip); }
.chip-improved { --cc: var(--note); }
.chip-fixed { --cc: var(--warn); }
.chip-plain { --cc: var(--fg-muted); }
.chip-plain::before { display: none; }

/* CSS-generated screenshots */
.shot {
  position: relative; margin: 20px 0 6px; aspect-ratio: 16 / 8.2;
  border-radius: var(--r-lg); border: 1px solid var(--border); overflow: hidden;
  background:
    radial-gradient(70% 90% at 100% 0%, var(--accent-soft), transparent 70%),
    radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 16px 16px,
    var(--bg-subtle);
  padding: 7% 8% 0;
}
.shot-win {
  height: 100%; border-radius: 10px 10px 0 0; background: var(--bg-elev);
  border: 1px solid var(--border); border-bottom: 0; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: 26px 1fr; overflow: hidden;
}
.shot-bar { display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--bg-subtle); }
.shot-bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.shot-bar .url { margin-left: 12px; height: 12px; width: 42%; border-radius: 4px; background: var(--bg-muted); border: 1px solid var(--border); }
.shot-body { position: relative; display: grid; grid-template-columns: 22% 1fr; gap: 6%; padding: 5% 6%; }
.sk { display: block; height: 7px; border-radius: 4px; background: var(--bg-muted); margin-bottom: 9px; }
.sk.w1 { width: 90%; } .sk.w2 { width: 70%; } .sk.w3 { width: 52%; } .sk.w4 { width: 80%; }
.sk.h { height: 12px; width: 60%; background: var(--border-strong); margin-bottom: 14px; }
.sk.blk { height: 48px; border-radius: 6px; }
.pin {
  position: absolute; width: 22px; height: 22px; border-radius: 50% 50% 50% 2px;
  background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
  font: 600 10px/1 var(--font-ui); box-shadow: 0 0 0 3px var(--bg-elev), var(--shadow-md);
}
.bubble {
  position: absolute; width: 38%; padding: 9px 10px; border-radius: 9px;
  background: var(--bg-elev); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
}
.bubble .sk { margin-bottom: 6px; height: 6px; }
.bubble .who { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.bubble .av { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, #8b9cff, #3b50d6); }
.bubble .ok { display: inline-block; height: 12px; width: 44px; border-radius: 99px; background: var(--tip-bg); border: 1px solid var(--tip-line); }
.prose p.shot-cap, .shot-cap { font-size: 12.5px; line-height: 1.5; color: var(--fg-subtle); margin: 8px 0 0; }
.shot-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5%; padding: 7% 6%; }
.shot-tiles span { aspect-ratio: 3/4; border-radius: 6px; border: 1px solid var(--border); }
.shot-mail { max-width: 58%; margin: 0 auto; padding: 6% 0; }

/* ---------- Page footer ---------- */
.page-foot { margin-top: 72px; }
.pf-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.helpful { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--fg-muted); min-height: 32px; }
.helpful .hb { display: inline-flex; gap: 6px; }
.hbtn {
  width: 32px; height: 32px; border-radius: var(--r); display: inline-grid; place-items: center;
  color: var(--fg-subtle); border: 1px solid var(--border); background: var(--bg-elev);
  transition: color .15s var(--ease), border-color .15s var(--ease), background-color .15s var(--ease), transform .15s var(--ease);
}
.hbtn:hover { color: var(--fg); border-color: var(--border-strong); }
.hbtn:active { transform: scale(.94); }
.hbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.hbtn[aria-pressed="true"] .i { animation: pop .25s var(--ease-out); }
.helpful .thanks { font-size: 13px; color: var(--fg-subtle); animation: lineIn .25s var(--ease-out); }
.pf-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--fg-subtle); }
.pf-meta a { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-muted); text-decoration: none; }
.pf-meta a:hover { color: var(--fg); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
.pager a {
  display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--r-lg);
  text-decoration: none; background: var(--bg-elev);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease-out);
}
.pager a:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.pager .pg-k { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-subtle); }
.pager .pg-t { font-weight: 500; font-size: 15px; color: var(--fg); }
.pager .next { text-align: right; justify-items: end; grid-column: 2; }
.pager a .i { transition: transform .2s var(--ease); }
.pager .prev:hover .i { transform: translateX(-2px); }
.pager .next:hover .i { transform: translateX(2px); }
.site-foot { margin-top: 48px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-subtle); }

/* ---------- Guides (reading layout) ---------- */
.guide-head { margin-bottom: 40px; }
.guide-kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--accent); margin-bottom: 14px; }
.page.is-guide h1 { font-size: 38px; line-height: 1.12; letter-spacing: -.032em; }
.guide-dek { font: 400 21px/1.5 var(--font-read); color: var(--fg-muted); margin: 0 0 24px; letter-spacing: -.003em; text-wrap: pretty; }
.byline { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--fg-subtle); padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font: 600 12.5px/1 var(--font-ui); color: #fff; letter-spacing: .02em;
  background: linear-gradient(140deg, #6b7cf5, #2b3aa8 70%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.byline b { display: block; font-weight: 500; color: var(--fg); font-size: 14px; }
.byline .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); display: inline-block; vertical-align: middle; margin: 0 8px; }
.reading p, .reading li { font: 400 19px/1.72 var(--font-read); color: var(--fg-body); letter-spacing: -.003em; }
.reading p { margin: 0 0 24px; }
.reading ul, .reading ol { margin: 0 0 24px; padding-left: 24px; }
.reading li { margin: 6px 0; }
.reading h2 { font-size: 24px; margin-top: 52px; }
.reading > p:first-of-type::first-letter { font-size: 3.2em; float: left; line-height: .82; padding: 6px 10px 0 0; font-weight: 500; color: var(--fg); }
.reading :not(pre) > code { font-size: .78em; }
.reading .code, .reading .table-wrap, .reading .callout { margin: 28px 0; }
.reading .callout .co-body p { font: 400 14.5px/1.65 var(--font-ui); margin: 0; }
blockquote.quote {
  margin: 36px 0; padding: 4px 0 4px 24px; border-left: 2px solid var(--accent);
}
blockquote.quote p { font: italic 400 24px/1.45 var(--font-read) !important; color: var(--fg) !important; margin: 0 0 10px !important; letter-spacing: -.01em; }
blockquote.quote p::first-letter { all: unset; }
blockquote.quote cite { font: 500 13px/1 var(--font-ui); color: var(--fg-subtle); font-style: normal; }

/* ---------- Lists ---------- */
.post-list { list-style: none; padding: 0; margin: 12px 0; border-top: 1px solid var(--border); }
.post-list > li.post-item { border-bottom: 1px solid var(--border); margin: 0; padding: 0; }
.post-item a {
  display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: baseline;
  padding: 16px 10px; margin: 0 -10px; border-radius: var(--r); text-decoration: none;
  transition: background-color .15s var(--ease);
}
.post-item a:hover { background: var(--bg-subtle); }
.post-item time { font: 400 12.5px/1.4 var(--font-mono); color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
.post-item .pt { font-weight: 500; font-size: 15px; color: var(--fg); letter-spacing: -.005em; transition: color .15s var(--ease); }
.post-item .pd { display: block; margin-top: 3px; font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }
.post-item .rt { font-size: 12.5px; color: var(--fg-subtle); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.post-item .rt .i { transition: transform .2s var(--ease); }
.post-item a:hover .pt { color: var(--accent); }
.post-item a:hover .rt .i { transform: translateX(2px); }

.proj-card { display: grid; gap: 10px; padding: 18px; }
.proj-top { display: flex; align-items: center; gap: 10px; }
.proj-mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.proj-meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--fg-subtle); margin-top: 4px; }
.proj-meta span { display: inline-flex; align-items: center; gap: 6px; }
.lang-dot { width: 8px; height: 8px; border-radius: 50%; }
.status { margin-left: auto; }

/* ---------- Design system ---------- */
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin: 20px 0; }
.swatch {
  display: grid; grid-template-rows: 76px auto; text-align: left;
  border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--bg-elev);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), border-color .2s var(--ease-out);
}
.swatch:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.swatch .chipc { position: relative; border-bottom: 1px solid var(--border); }
.swatch .chipc::after { content: "Copy"; position: absolute; right: 8px; top: 8px; font: 500 11px/1 var(--font-ui); padding: 4px 6px; border-radius: 5px; background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .15s var(--ease); }
.swatch:hover .chipc::after, .swatch:focus-visible .chipc::after { opacity: 1; }
.swatch .sw-t { padding: 10px 12px 12px; display: grid; gap: 3px; }
.swatch .sw-n { font-weight: 500; font-size: 13.5px; }
.swatch .sw-v { font: 400 11.5px/1.4 var(--font-mono); color: var(--fg-subtle); }
.swatch .sw-v b { font-weight: 500; color: var(--fg-muted); }

.specimen { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin: 18px 0; }
.spec-head { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--fg-subtle); }
.spec-head b { font-weight: 600; color: var(--fg); font-size: 13.5px; }
.spec-head .mono { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; }
.spec-row { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: baseline; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.spec-row:last-child { border-bottom: 0; }
.spec-row .sz { font: 400 11.5px/1.5 var(--font-mono); color: var(--fg-subtle); }
.spec-row .sm { min-width: 0; overflow-wrap: anywhere; }

.textures { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin: 20px 0; }
.tex { position: relative; aspect-ratio: 4/3; border-radius: var(--r-lg); border: 1px solid var(--border); overflow: hidden; }
.tex span { position: absolute; left: 10px; bottom: 10px; font: 500 11.5px/1 var(--font-ui); padding: 5px 7px; border-radius: 6px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--fg-muted); }
.tex-grid { background-color: var(--bg-subtle); background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); background-size: 20px 20px; }
.tex-dots { background-color: var(--bg-subtle); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size: 14px 14px; }
.tex-noise { isolation: isolate; }
.tex-noise::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(90% 90% at 90% 0%, rgba(99,112,241,.38), transparent 60%), radial-gradient(70% 80% at 10% 110%, rgba(45,190,170,.26), transparent 60%), var(--bg-subtle); }
.tex-noise::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .45; mix-blend-mode: soft-light; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.ds-panel { margin: 16px 0 24px; padding: 20px; border: 1px solid var(--border); border-radius: var(--r-lg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 16px 16px; background-color: var(--bg-subtle); }
.ds-label { font: 500 11.5px/1 var(--font-mono); color: var(--fg-subtle); margin: 0 0 10px; }
.ds-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ds-row + .ds-label { margin-top: 18px; }
.mini-nav { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-elev); box-shadow: var(--shadow-sm); overflow: hidden; }
.mini-nav .wordmark { font-size: 14px; }
.mini-nav .mn-links { display: flex; gap: 2px; margin-left: 8px; }
.mini-nav .mn-links span { font-size: 13px; color: var(--fg-muted); padding: 5px 9px; border-radius: 6px; }
.mini-nav .mn-links span.on { color: var(--fg); background: var(--bg-muted); }
.mini-nav .mn-search { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; font-size: 12.5px; color: var(--fg-subtle); border: 1px solid var(--border); border-radius: 7px; background: var(--bg-subtle); }
.ds-post { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0 16px; }
.ds-post .post-list { margin: 0; border-top: 0; }
.ds-post .post-item:last-child { border-bottom: 0; }
.link-demo { font-size: 15.5px; color: var(--fg-body); }
.link-demo .link.is-hover { color: var(--accent); text-decoration-color: var(--accent); }

/* ---------- Search ---------- */
.search-root { position: fixed; inset: 0; z-index: 100; display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; }
.search-root[hidden] { display: none; }
.search-scrim { position: absolute; inset: 0; background: rgba(10,10,12,.32); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade .18s var(--ease); }
[data-theme="dark"] .search-scrim { background: rgba(0,0,0,.6); }
@keyframes fade { from { opacity: 0; } }
.search-panel {
  position: relative; width: 100%; max-width: 620px; max-height: min(560px, 76vh);
  display: flex; flex-direction: column;
  background: var(--bg-elev); border-radius: 14px; box-shadow: var(--shadow-xl);
  overflow: hidden; animation: panelIn .22s var(--ease-out);
}
@keyframes panelIn { from { opacity: 0; transform: translateY(-8px) scale(.985); } }
.search-field { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; height: 56px; border-bottom: 1px solid var(--border); color: var(--fg-subtle); }
.search-field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font: 400 16px/1 var(--font-ui); color: var(--fg); outline: none; }
.search-field input::placeholder { color: var(--fg-subtle); }
.search-field input::-webkit-search-cancel-button { display: none; }
.esc-btn { border-radius: 6px; }
.results { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; overscroll-behavior: contain; }
.r-sec { padding: 10px 10px 6px; font-size: 11.5px; font-weight: 600; color: var(--fg-subtle); display: flex; align-items: center; justify-content: space-between; }
.r-sec button { font-weight: 500; font-size: 11.5px; color: var(--fg-subtle); padding: 2px 6px; border-radius: 5px; }
.r-sec button:hover { color: var(--fg); background: var(--bg-muted); }
.r-item {
  display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center;
  padding: 8px 10px; border-radius: var(--r); cursor: pointer; color: var(--fg-body);
  scroll-margin: 8px;
}
.r-item .r-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--fg-subtle); background: var(--bg-subtle); border: 1px solid var(--border); }
.r-item .r-t { font-size: 14px; font-weight: 500; color: var(--fg); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-item .r-p { font-size: 12.5px; color: var(--fg-subtle); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-item .r-go { color: var(--fg-subtle); opacity: 0; }
.r-item mark { background: none; color: var(--accent); font-weight: 600; }
.r-item[aria-selected="true"] { background: var(--accent-soft); }
.r-item[aria-selected="true"] .r-ic { color: var(--accent); border-color: var(--accent-line); background: var(--bg-elev); }
.r-item[aria-selected="true"] .r-go { opacity: 1; }
.r-item > span:nth-child(2) { min-width: 0; }
.r-empty { padding: 40px 16px; text-align: center; color: var(--fg-subtle); font-size: 14px; }
.r-empty b { color: var(--fg); font-weight: 500; }
.search-foot { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg-subtle); font-size: 12px; color: var(--fg-subtle); }
.search-foot span { display: inline-flex; align-items: center; gap: 5px; }
.search-foot .sf-r { margin-left: auto; }

/* ---------- Toast & corner ---------- */
.toast-wrap { position: fixed; left: 50%; bottom: 24px; z-index: 120; transform: translateX(-50%); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 12px;
  font-size: 13.5px; font-weight: 500; color: var(--bg); background: var(--fg);
  border-radius: 10px; box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(10px) scale(.98);
  transition: opacity .2s var(--ease), transform .25s var(--ease-out);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: none; }
.toast .i { color: #4ade80; }
[data-theme="dark"] .toast .i { color: #15803d; }
.corner {
  position: fixed; left: 16px; bottom: 16px; z-index: 40;
  display: inline-flex; align-items: center; gap: 7px;
  font: 500 11.5px/1 var(--font-mono); color: var(--fg-muted); text-decoration: none;
  padding: 7px 10px; border-radius: 999px;
  background: var(--bg-blur); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--border); box-shadow: var(--shadow-md);
  transition: color .15s var(--ease), border-color .15s var(--ease);
}
.corner:hover { color: var(--fg); border-color: var(--border-strong); }
.corner i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- Responsive ---------- */
@media (max-width: 1199px) {
  .shell { grid-template-columns: 256px minmax(0,1fr); }
  .toc { display: none; }
  .toc-m { display: block; }
  main { padding-top: 40px; }
  .search-trigger { width: 220px; }
  .top-links { display: none; }
}
@media (max-width: 899px) {
  :root { --topbar: 52px; }
  .shell { grid-template-columns: minmax(0,1fr); }
  .nav-toggle { display: inline-grid; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
    width: min(304px, 86vw); height: 100%;
    background: var(--bg); border-right: 1px solid var(--border); box-shadow: var(--shadow-xl);
    padding-top: 20px;
    transform: translateX(-102%); visibility: hidden;
    transition: transform .3s var(--ease-out), visibility 0s linear .3s;
  }
  .nav-open .sidebar { transform: none; visibility: visible; transition: transform .3s var(--ease-out); }
  .side-foot .repo { display: inline-flex; }
  .topbar { padding: 0 12px; gap: 6px; }
  .search-trigger { width: 34px; padding: 0; justify-content: center; margin-left: auto; background: none; border-color: transparent; }
  .search-trigger .st-label, .search-trigger .keys { display: none; }
  .spacer { display: none; }
  .repo { display: none; }
  main { padding: 28px 20px 112px; }
  .toc-m { margin: -28px -20px 24px; padding: 0 20px; }
  .hx { scroll-margin-top: calc(var(--topbar) + 60px); }
}
@media (max-width: 640px) {
  .wm-sep, .wm-docs { display: none; }
  main { padding: 24px 16px 112px; }
  .toc-m { margin: -24px -16px 20px; padding: 0 16px; }
  .page h1 { font-size: 29px; }
  .page.is-guide h1 { font-size: 31px; }
  .guide-dek { font-size: 19px; }
  .reading p, .reading li { font-size: 18px; }
  .hero { padding: 28px 20px 24px; border-radius: var(--r-lg); }
  .hero h1 { font-size: 32px; }
  .cards, .cards.three { grid-template-columns: minmax(0,1fr); }
  .swatches { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .textures { grid-template-columns: minmax(0,1fr); }
  .tex { aspect-ratio: 16/7; }
  .pager { grid-template-columns: minmax(0,1fr); }
  .pager .next { grid-column: 1; }
  .cl-entry { grid-template-columns: minmax(0,1fr); }
  .cl-rail { padding: 40px 0 0 32px; border-left: 1px solid var(--border); }
  .cl-rail-in { position: static; display: flex; align-items: center; gap: 10px; }
  .cl-body::before { top: -48px; }
  .cl-body h2 { margin-top: 14px; }
  .cl-list li { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .post-item a { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .post-item .rt { display: none; }
  .spec-row { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .params thead { display: none; }
  .params, .params tbody, .params tr, .params td { display: block; width: 100%; }
  .params tr { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .params tr:last-child { border-bottom: 0; }
  .params td { border: 0; padding: 3px 0; }
  .params td[data-l]::before { content: attr(data-l); display: inline-block; width: 64px; font-size: 11.5px; color: var(--fg-subtle); }
  .params td.p-desc::before { display: none; }
  .params td.p-desc { padding-top: 8px; }
  .p-req, .p-opt { display: inline; margin: 0 0 0 8px; }
  .search-root { padding: 8px; }
  .search-panel { max-height: calc(100dvh - 16px); }
  .search-foot .sf-r, .search-foot span:nth-child(3) { display: none; }
  .mini-nav .mn-links span:not(.on) { display: none; }
  .ver { display: none; }
  .corner { left: 12px; bottom: 12px; }
  .toast { white-space: normal; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .card:hover, .swatch:hover { transform: none; }
  .caret { animation: none; }
  .dg-edge.is-on { animation: none; }
}
</style>

    <span>Z. Christensen</span><span class="wm-sep" aria-hidden="true">/</span><span class="wm-docs">Docs</span>
  </a>
  <div class="ver">
    <button class="ver-btn" id="verBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="verMenu" aria-label="Documentation version, v2026.09"><span id="verLabel">v2026.09</span></button>

  </div>

    page(p.id, { title: p.title, crumbs: ['Writing'], updated: p.date.replace(/(\w{3})\w* (\d+), (\d+)/, '$1 $2, $3'), kind: 'guide', desc: p.dek, post: p }, function () {

  guide(POSTS[0], function () {
    return '<p>For a year my design feedback lived in chat. I’d look at a prototype, switch windows, and type something like “the second card’s price wraps weirdly on mobile.” The agent would guess which card, which breakpoint and which kind of weird, and it would guess wrong often enough that I started attaching screenshots by hand.</p>' +
      '<p>That workflow has three leaks: location, state and intent. Chat carries only the last one. claude-feedback is my attempt to plug the other two without adding a single step to how I already review.</p>' +
      H(2, 'problem', 'The problem with feedback in chat') +
      '<p>When I point at something on a screen, I’m pointing at a rendered pixel, at a specific viewport, after specific interactions. By the time that becomes a sentence, all of that has been compressed into nouns. “The second card” is only unambiguous to the person who saw it.</p>' +
      '<p>Design tools solved this long ago with pinned comments. Prototypes built by agents live on localhost, though, and localhost has no comment layer.</p>' +
      H(2, 'why-a-proxy', 'Why a proxy, not an extension') +
      '<p>My first version was a browser extension. It worked in exactly one browser and none of the embedded preview panes agents use. A proxy works everywhere a URL does: any browser, a phone on the same network, a teammate’s laptop through a tunnel.</p>' +
      '<p>The cost is one rewrite per HTML response. The proxy finds the closing body tag and inserts a script before it:</p>' +
      code('ts', 'const at = html.lastIndexOf("<\/body>");\nif (at === -1) return html;\nreturn html.slice(0, at) + OVERLAY_TAG + html.slice(at);', 'inject.ts') +
      H(2, 'anchoring', 'Anchoring comments to something that moves') +
      '<p>Prototypes change constantly; that’s the point of them. A comment pinned to coordinates drifts the moment the layout shifts. A comment pinned to a CSS selector breaks the moment a class is renamed.</p>' +
      '<p>I store both, plus a short fingerprint of the element’s text. When the page reloads, the overlay tries the selector, falls back to the fingerprint, and only then to coordinates. In practice the fingerprint rescues most comments that would otherwise be orphaned.</p>' +
      '<blockquote class="quote"><p>The screenshot is the source of truth. Everything else is an attempt to find that moment again.</p><cite>— design note, v0.2</cite></blockquote>' +
      H(2, 'closing-the-loop', 'Closing the loop') +
      '<p>The part I underestimated was resolution. Early on, comments piled up forever because nothing marked them done. Now the agent writes <code>resolved: true</code> after a fix, and the dock fades that pin. Review becomes a queue that empties, which turns out to matter more than any feature in the overlay itself.</p>' +
      callout('tip', 'Try this', 'Leave comments in the voice you’d use with a colleague sitting next to you. Agents act on intent far better than on terse instructions.') +
      H(2, 'differently', 'What I’d do differently') +
      '<ul><li>Start with resolution, not creation. A comment system is only as good as its ability to become empty.</li><li>Ship the screenshot on day one. Every other anchoring trick is a fallback for it.</li><li>Keep the store a plain file for as long as possible. Being able to read it with <code>cat</code> has saved me more debugging time than any UI.</li></ul>';
  });
  guide(POSTS[1], function () {
    return '<p>Morning Briefing started as a favor. A colleague wanted a short, sober summary of the news waiting in their inbox at 6:30 every weekday, written the way a well-read friend would explain it over coffee. Six weeks and sixty-three runs later, here is what I’d tell anyone building something similar.</p>' +
      H(2, 'search-is-the-product', 'Search is the product') +
      '<p>I spent the first week tuning the writing prompt. That was the wrong week. When a briefing was bad, it was almost always because the right story never made it into the context. The model can’t summarize what it wasn’t shown.</p>' +
      '<p>The fix was unglamorous: search each outlet by name, one at a time, restricted to the last day. It’s slower and it costs more calls, but the results are reproducible, and when something is missing I can see which outlet didn’t have it.</p>' +
      H(2, 'ranking', 'Ranking without a newsroom') +
      '<p>A story leads if it’s covered by at least two independent outlets, weighted by how much I trust each source for that subject. Wire copy republished in six places counts once. That single rule removed most of the week-one noise.</p>' +
      params([
        ['coverage', 'number', 'req', '', 'Independent outlets covering the cluster. Two or more to lead.'],
        ['weight', 'number', 'opt', '1.0', 'Per-outlet trust, set by hand and revisited monthly.'],
        ['thread', 'boolean', 'opt', 'false', 'Boost for stories that update a running thread.']
      ], 'Ranking signals') +
      H(2, 'voice', 'Writing in a voice people trust') +
      '<p>The house style is mostly a list of prohibitions: no bullet points, no bolded summary sentences, no adjectives that tell the reader how to feel. Opinion pieces are labeled as opinion in the same sentence that cites them. The result reads plainer than most newsletters, and that plainness is why it gets read.</p>' +
      '<blockquote class="quote"><p>If a sentence would still be true with the adjective removed, remove the adjective.</p><cite>— house style, rule 4</cite></blockquote>' +
      H(2, 'failure-modes', 'Failure modes') +
      '<ul><li><strong>Quiet days.</strong> The agent padded thin news with background. Now a quiet day produces a short briefing, and says so.</li><li><strong>Stale threads.</strong> Running stories were re-summarized from scratch. They now open with what changed since yesterday.</li><li><strong>Length creep.</strong> The first run was 1,900 words. A hard budget at the writing stage fixed it; asking nicely did not.</li></ul>' +
      H(2, 'lessons', 'Lessons') +
      '<ol><li>Write every stage’s output to disk. Replaying from the middle is how you debug.</li><li>Fix recall before you polish prose.</li><li>Constraints in code beat constraints in prompts.</li><li>Ask the reader what they skipped. It’s better feedback than what they read.</li></ol>';
  });
  guide(POSTS[2], function () {
    return '<p>Most interface motion I remove is motion that was added to make something feel finished. The motion I keep has a job: it shows where something came from, confirms that an action happened, or keeps you oriented while the screen changes. These are the notes I’ve collected on the difference.</p>' +
      H(2, 'motion-is-feedback', 'Motion is feedback') +
      '<p>A button that depresses by one pixel when pressed tells you the press registered before the network does. A panel that slides from the edge it lives on tells you how to dismiss it. Neither is decoration; both are answers to a question the user didn’t have to ask.</p>' +
      H(2, 'durations', 'Durations I actually use') +
      '<p>I keep a short scale and resist adding to it. Almost everything fits one of four values:</p>' +
      params([
        ['instant', 'number', 'opt', '120ms', 'Hover and press states. Anything slower feels laggy under a cursor.'],
        ['small', 'number', 'opt', '180ms', 'Menus, tooltips, toggles — elements under about 200px.'],
        ['panel', 'number', 'opt', '280ms', 'Drawers, dialogs and anything that crosses a large distance.'],
        ['page', 'number', 'opt', '320ms', 'Route transitions, split into a quick exit and a slower entrance.']
      ], 'Duration scale') +
      H(2, 'easing', 'Easing') +
      '<p>Entrances decelerate; exits accelerate. I use one strong ease-out for nearly everything that appears and let exits run about half as long. Symmetric easing on both is the most common reason an otherwise good transition feels mechanical.</p>' +
      code('css', '--ease-out: cubic-bezier(.16, 1, .3, 1);\n\n.panel { transition: transform 280ms var(--ease-out); }\n.panel.is-closing { transition-duration: 140ms; }', 'motion.css') +
      H(2, 'reduced-motion', 'Reduced motion is a design, not a switch') +
      '<p>Honoring <code>prefers-reduced-motion</code> doesn’t mean deleting feedback. Swap movement for opacity, keep state changes visible, and make sure nothing important is conveyed only through motion. A typing animation should show its full text immediately; a sliding indicator can simply appear in place.</p>' +
      callout('note', 'A useful test', 'Turn on reduced motion and use your product for a day. Anything that feels broken was relying on motion to communicate.') +
      H(2, 'checklist', 'A short checklist') +
      '<ol><li>Does this motion answer a question the user has right now?</li><li>Does it start from where the element lives?</li><li>Is the exit faster than the entrance?</li><li>Does it still make sense with motion reduced?</li></ol>';
  });
